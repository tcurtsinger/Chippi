<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chippi Phase 6: saved app arrangements</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;margin:0}
svg.g{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}

/* ---------- island tokens (Chippi.UI/Themes Dark.xaml / Light.xaml) ---------- */
.dark{--fill:rgba(40,40,44,.961);--bord:rgba(255,255,255,.09);--hair:rgba(255,255,255,.078);--face:rgba(255,255,255,.024);--faceh:rgba(255,255,255,.10);--cardb:rgba(255,255,255,.059);
 --btn:rgba(255,255,255,.071);--btnh:rgba(255,255,255,.09);--ctlb:rgba(255,255,255,.09);--hov:rgba(255,255,255,.059);--muted:rgba(255,255,255,.28);
 --tx:#FFFFFF;--tx2:#C9C9C9;--tx3:#9A9A9A;--acc:#B79CFF;--accf:linear-gradient(135deg,#B78FFF,#82AEFF);--tint:rgba(183,156,255,.14);--onacc:#170F2E;--cau:#FF99A4;--warn:#FCE100;
 --shadow:0 16px 40px rgba(0,0,0,.5);--desk:#1F1F1F;--zone:rgba(255,255,255,.085);--mono:rgba(183,156,255,.16);
 /* Settings */
 --win:#202020;--surf:#2B2B2B;--sbord:rgba(255,255,255,.031);--div:rgba(255,255,255,.059);--st1:#FFFFFF;--st2:#C5C5C5;--st3:#ABABAB;--st4:#9D9D9D;
 --shov:rgba(255,255,255,.039);--ssel:rgba(255,255,255,.059);--sbtn:rgba(255,255,255,.059);--sbtnh:rgba(255,255,255,.09);--sbtnb:rgba(255,255,255,.09);--sacc:#B79CFF;--sonacc:#000;--swarn:#FCE100;--pop:#2C2C2C;--field:rgba(255,255,255,.059);--fieldb:rgba(255,255,255,.55)}
.light{--fill:rgba(245,245,246,.961);--bord:rgba(0,0,0,.078);--hair:rgba(0,0,0,.078);--face:rgba(255,255,255,.45);--faceh:#FFFFFF;--cardb:rgba(0,0,0,.059);
 --btn:rgba(255,255,255,.86);--btnh:#F6F6F6;--ctlb:rgba(0,0,0,.09);--hov:rgba(0,0,0,.043);--muted:rgba(0,0,0,.18);
 --tx:#1A1A1A;--tx2:#5C5C5C;--tx3:#707070;--acc:#7444F0;--accf:linear-gradient(135deg,#8F5CFF,#5B86FF);--tint:rgba(116,68,240,.10);--onacc:#FFFFFF;--cau:#C42B1C;--warn:#9D5D00;
 --shadow:0 16px 40px rgba(0,0,0,.2);--desk:#1F1F1F;--zone:rgba(0,0,0,.07);--mono:rgba(116,68,240,.12);
 --win:#F3F3F3;--surf:#FBFBFB;--sbord:rgba(0,0,0,.059);--div:rgba(0,0,0,.071);--st1:#1A1A1A;--st2:#404040;--st3:#5D5D5D;--st4:#616161;
 --shov:rgba(0,0,0,.039);--ssel:rgba(0,0,0,.055);--sbtn:#FFFFFF;--sbtnh:#F6F6F6;--sbtnb:rgba(0,0,0,.10);--sacc:#6B4FBB;--sonacc:#FFF;--swarn:#9D5D00;--pop:#F9F9F9;--field:#FFFFFF;--fieldb:rgba(0,0,0,.45)}

/* ---------- sheet ---------- */
.sheet{display:inline-flex;flex-direction:column;gap:28px;padding:32px;background:#161616;color:#E6E6E6}
.sheet.lt{background:#D9D9D9;color:#1A1A1A}
.srow{display:flex;gap:28px;align-items:flex-start}
.cap{font-size:13px;line-height:18px;font-weight:600;margin:0 0 8px}
.cap span{font-weight:400;opacity:.7}
.stage{background:var(--desk);padding:24px 32px 40px;border-radius:2px}

/* ---------- island panel 520x360 ---------- */
.panel{position:relative;width:520px;height:360px;padding:12px;background:var(--fill);border:1px solid var(--bord);border-radius:8px;box-shadow:var(--shadow);color:var(--tx);font-size:12px;line-height:16px;overflow:hidden}
.hdr{display:flex;align-items:center;height:24px;margin-bottom:8px}
.ib{width:28px;height:24px;display:inline-flex;align-items:center;justify-content:center;border:0;padding:0;border-radius:4px;background:transparent;color:var(--tx2)}
.ib.back{margin:0 4px 0 -4px}
.ttl{flex:1;font-size:14px;font-weight:600;line-height:20px;white-space:nowrap}
.body{position:relative;width:494px;height:302px}
.grid{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.tile{position:relative;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;border:1px solid var(--cardb);border-radius:6px;background:var(--face);color:var(--tx)}
.grid.r4 .tile{height:61px}
.tile .lb{font-size:12px;font-weight:600;line-height:16px;margin:3px 2px 0}
.tile .st{font-size:11px;line-height:14px;margin:1px 3px 0;color:var(--tx2);white-space:nowrap}
.tile .chev{position:absolute;top:7px;right:6px}
.tile.on{background:var(--accf);border-color:transparent;color:var(--onacc)}
.tile.on .st{color:var(--onacc)}
.tile.hov{background:var(--faceh)}
.tile.dis{opacity:.5}
.tile.new::after{content:"";position:absolute;left:6px;top:6px;width:6px;height:6px;border-radius:3px;background:var(--acc)}
.foc{outline:2px solid var(--tx);outline-offset:1px}

/* list pages */
.topbar{display:flex;align-items:center;height:28px;gap:8px;font-size:11px;color:var(--tx3);white-space:nowrap}
.topbar .cau{color:var(--cau)}
.rows{position:absolute;left:0;right:0;top:34px;display:grid;column-gap:8px}
.row{height:42px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:4px;color:var(--tx);border:0;background:transparent;text-align:left;width:100%}
.row.hov{background:var(--hov)}
.row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app{height:42px;display:flex;align-items:center;gap:8px;padding:0 3px 0 5px;border-radius:4px}
.mono{width:16px;height:16px;border-radius:3px;background:var(--mono);color:var(--acc);font-size:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-right:2px}
.badge{height:18px;padding:0 6px;border-radius:4px;background:var(--btn);font-size:11px;font-weight:600;color:var(--tx2);display:inline-flex;align-items:center;white-space:nowrap}
.badge.cau{color:var(--cau)}
.x{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;color:var(--tx2);flex:none}
.ibtn{height:28px;padding:0 11px;border-radius:4px;border:1px solid var(--ctlb);background:var(--btn);font-size:12px;color:var(--tx);white-space:nowrap}
.foot{position:absolute;right:0;bottom:0;left:0;display:flex;gap:8px;justify-content:flex-end}
.foot .l{margin-right:auto}
/* island switch 34x18 */
.isw{width:34px;height:18px;border-radius:9px;border:1px solid var(--tx3);position:relative;flex:none}
.isw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:6px;background:var(--tx2)}
.isw.on{background:var(--accf);border-color:transparent}
.isw.on::after{left:auto;right:2px;background:var(--onacc)}
.rowst{font-size:11px;color:var(--tx3);margin-right:6px}

/* snap pictures */
.pics{position:absolute;left:0;right:0;top:34px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pic{height:98px;padding:6px 6px 0;border:1px solid var(--cardb);border-radius:6px;background:var(--face);display:flex;flex-direction:column}
.zs{flex:1;display:grid;gap:3px}
.z{border-radius:3px;background:var(--zone);border:1px solid transparent}
.z.hov{background:var(--tint);border-color:var(--acc)}
.pic .pn{height:20px;font-size:11px;line-height:20px;color:var(--tx3);white-space:nowrap}
.pics.off{opacity:.5}
.cmds{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cmd{height:42px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--cardb);border-radius:6px;background:var(--face);font-size:12px;color:var(--tx)}
.cmds.off{opacity:.5}

/* ---------- Settings ---------- */
.sw{width:1120px;background:var(--win);color:var(--st1);font-size:14px;line-height:20px;border:1px solid rgba(128,128,128,.35);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.sw.narrow{width:860px}
.tbar{height:40px;display:flex;align-items:center;flex:none}
.tbar .logo{width:16px;height:16px;border-radius:8px;background:linear-gradient(135deg,#B78FFF,#82AEFF);margin:0 12px 0 16px}
.tbar .tt{flex:1;font-size:12px}
.tbar .cb{width:46px;height:40px;display:flex;align-items:center;justify-content:center}
.shell{display:flex;flex:1}
.side{width:272px;flex:none;padding:12px 4px 0 4px}
.side.rail{width:48px;padding:4px 4px 0}
.find{height:32px;margin:0 12px 8px;padding:0 10px;border-radius:4px;background:var(--field);border:1px solid var(--sbtnb);border-bottom-color:var(--fieldb);display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--st4)}
.gl{font-size:12px;font-weight:600;color:var(--st3);padding:12px 16px 4px;line-height:16px}
.gl:first-of-type{padding-top:0}
.nav{position:relative;height:32px;margin:2px 4px;padding:0 12px;border-radius:4px;display:flex;align-items:center;gap:12px;white-space:nowrap}
.nav.sel{background:var(--ssel);font-weight:600}
.nav.sel::before{content:"";position:absolute;left:0;top:8px;width:3px;height:16px;border-radius:2px;background:var(--sacc)}
.rail .nav{padding:0;justify-content:center;margin:2px 0}
.rail .hl{height:1px;background:var(--div);margin:6px 8px}
.page{flex:1;padding:4px 40px 28px;min-width:0}
.ptitle{font-family:'Segoe UI Variable Display','Segoe UI',sans-serif;font-size:20px;font-weight:600;line-height:28px;margin:0 0 14px}
.sh{font-size:14px;font-weight:600;line-height:20px;margin:24px 0 8px}
.sh:first-of-type{margin-top:0}
.card{background:var(--surf);border:1px solid var(--sbord);border-radius:8px;position:relative}
.sr{min-height:48px;display:flex;align-items:center;padding:8px 16px;gap:12px;border-top:1px solid var(--div)}
.sr:first-child{border-top:0}
.sr .lead{width:20px;height:20px;color:var(--st1);flex:none}
.sr .tl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .tl small{display:block;font-size:12px;line-height:16px;color:var(--st3)}
.sr .ctl{display:flex;align-items:center;gap:8px;flex:none}
.sr.hov{background:var(--shov)}
.sr.edit{background:var(--shov)}
.sr .mut{color:var(--st3)}
.sr .warn{color:var(--swarn);font-size:14px;display:flex;align-items:center;gap:6px}
.sbt{height:32px;padding:0 12px;border-radius:4px;border:1px solid var(--sbtnb);background:var(--sbtn);font-size:14px;color:var(--st1);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.sbt.acc{background:var(--sacc);border-color:var(--sacc);color:var(--sonacc)}
.sbt.icon{width:32px;padding:0;justify-content:center;background:transparent;border-color:transparent;color:var(--st2)}
.sbt.tog.on{background:var(--sacc);border-color:var(--sacc);color:var(--sonacc)}
.combo{height:32px;min-width:200px;padding:0 10px 0 11px;border-radius:4px;border:1px solid var(--sbtnb);background:var(--sbtn);display:inline-flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;white-space:nowrap}
.combo.open{border-color:var(--sacc)}
.combo .ph{color:var(--st3)}
.caps{display:flex;align-items:center;gap:4px}
.kc{height:24px;min-width:24px;padding:0 7px;border-radius:4px;border:1px solid var(--sbtnb);border-bottom-width:2px;background:var(--sbtn);font-size:12px;line-height:20px;color:var(--st1);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.kc.dim{color:var(--st3)}
.plus{font-size:12px;color:var(--st3)}
.ssw{width:40px;height:20px;border-radius:10px;border:1px solid var(--st2);position:relative;flex:none}
.ssw::after{content:"";position:absolute;left:3px;top:3px;width:12px;height:12px;border-radius:6px;background:var(--st2)}
.ssw.on{background:var(--sacc);border-color:var(--sacc)}
.ssw.on::after{left:auto;right:3px;top:2px;width:14px;height:14px;border-radius:7px;background:var(--sonacc)}
.listen{height:32px;min-width:290px;padding:0 11px;border-radius:4px;border:1px solid var(--sacc);box-shadow:inset 0 0 0 1px var(--sacc);background:var(--field);display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--st2)}
.pop{position:absolute;z-index:3;background:var(--pop);border:1px solid var(--sbtnb);border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.3);padding:4px;font-size:14px}
.pop .pf{height:32px;margin:4px 4px 6px;padding:0 10px;border-radius:4px;border:1px solid var(--sbtnb);border-bottom:2px solid var(--sacc);background:var(--field);display:flex;align-items:center;gap:8px}
.pop .pg{font-size:12px;font-weight:600;color:var(--st3);padding:8px 12px 2px}
.pop .pi{height:32px;padding:0 12px;border-radius:4px;display:flex;align-items:center;gap:12px;white-space:nowrap}
.pop .pi.hov{background:var(--shov)}
.pop .pi .k{margin-left:auto;font-size:12px;color:var(--st3)}
.infobar{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 8px 8px 16px;margin-bottom:8px;border-radius:8px;background:var(--surf);border:1px solid var(--sbord);color:var(--st1)}
.infobar .ic{color:var(--swarn)}
.infobar .t{flex:1}
.stcard{width:768px}
/* ---------- wave 1 additions ---------- */
.sw.tall{height:auto}
.sw.fixed{height:720px}
.sw.fixed .page{overflow:hidden}
.sr .on{font-size:14px;color:var(--st1)}
.sr.dep{padding-left:50px}
.sr .tl small.cau{color:var(--cau)}
.light .sr .tl small.cau{color:#C42B1C}
.dark .sr .tl small.cau{color:#FF99A4}
.card+.card{margin-top:8px}
.card.dim>.sr{opacity:.45}
.card.dim>.sr:first-child{opacity:1}
.card.dim.all>.sr{opacity:.45}
.appn{display:flex;align-items:center;gap:12px}
.appn .mono{width:20px;height:20px;font-size:10px;margin:0}
/* WinUI slider: 4 track, 20 thumb with an accent dot */
.sld{position:relative;width:200px;height:20px;flex:none}
.sld::before{content:"";position:absolute;left:0;right:0;top:8px;height:4px;border-radius:2px;background:var(--st4);opacity:.55}
.sld i{position:absolute;left:0;top:8px;height:4px;border-radius:2px;background:var(--sacc)}
.sld b{position:absolute;top:0;width:20px;height:20px;margin-left:-10px;border-radius:10px;background:var(--pop);border:1px solid var(--sbtnb);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sld b::after{content:"";position:absolute;left:4px;top:4px;width:10px;height:10px;border-radius:5px;background:var(--sacc)}
.val{min-width:52px;text-align:right;font-size:14px}
.preview{width:300px;height:88px;border:1px solid var(--sbtnb);border-radius:4px;background:var(--field);overflow:hidden;position:relative;font-size:12px;line-height:18px;color:var(--st2);padding:4px 10px}
.preview .thumb{position:absolute;right:2px;top:22px;width:2px;height:28px;border-radius:1px;background:var(--st3)}
.pop .sep{height:1px;background:var(--div);margin:4px 0}
.pop .pi .mono{width:20px;height:20px;font-size:10px;margin:0}
.listen.sm{min-width:200px}
.dimtxt{opacity:.45}
/* the bar (DESIGN.md §5 Island: 256x50, round ends, Chippi 46 at the puck end) */
.bar{position:relative;width:256px;height:50px;border-radius:25px;background:var(--fill);border:1px solid var(--wrim);box-shadow:0 4px 12px rgba(0,0,0,.28);display:flex;align-items:center;color:var(--tx);white-space:nowrap;flex:none}
.dark{--wrim:rgba(255,255,255,.17)}
.light{--wrim:rgba(0,0,0,.12)}
.bar .lead{width:34px;height:34px;border-radius:17px;background:var(--tint);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.bar .lines{width:148px;display:flex;flex-direction:column;min-width:0;flex:none}
.bar .bt{font-size:13px;font-weight:600;line-height:17px;overflow:hidden}
.bar .ba{font-size:12px;line-height:16px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis}
.bar .pet{width:46px;display:flex;justify-content:center;flex:none}
.bar .cut{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 8px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 8px),transparent)}
.puckonly{width:50px;height:50px;border-radius:25px;background:var(--fill);border:1px solid var(--wrim);box-shadow:0 4px 12px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center}
.desk2{background:var(--desk);padding:20px 24px;border-radius:2px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;min-width:330px}
.desk2.left{align-items:flex-start}
.note{font-size:12px;line-height:16px;opacity:.75;max-width:330px;margin-top:6px}
.win{width:300px;height:120px;border-radius:8px;background:var(--surf);border:1px solid var(--sbord);color:var(--st1);font-size:12px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.win .wt{font-size:12px;color:var(--st3);margin-bottom:6px}
.dlg{position:absolute;left:40px;top:34px;width:220px;padding:10px;border-radius:8px;background:var(--pop);border:1px solid var(--sbtnb);font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.dlg .bs{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}
.dlg .bs span{height:24px;padding:0 10px;border-radius:4px;border:1px solid var(--sbtnb);background:var(--sbtn);display:inline-flex;align-items:center}
.dlg .bs span.acc{background:var(--sacc);color:var(--sonacc);border-color:var(--sacc)}
/* ---------- wave 2: Shortcuts ---------- */
.grp{padding:12px 16px 4px;font-size:12px;font-weight:600;line-height:16px;color:var(--st3);border-top:1px solid var(--div)}
.grp:first-child{border-top:0}
.sr .tl small .si{display:inline-flex;align-items:center;gap:4px}
.light .sr .tl small.cau{color:#C42B1C}
.kc .g{margin-left:-1px}
/* revision 2 (Travis, task 344): one keys column, no state lines, clashes refused in the editor */
.kcol{width:200px;flex:none;display:flex;justify-content:flex-start}
.kspace{width:32px;flex:none}
.caps.dim{opacity:.45}
.dark{--scau:#FCE100}.light{--scau:#9D5D00}
.field.bad{border-color:var(--scau);box-shadow:inset 0 0 0 1px var(--scau)}
.sr .tl .msg{display:inline-flex;align-items:center;gap:8px;color:var(--scau)}
.tip{position:absolute;z-index:3;padding:6px 8px;border-radius:4px;background:var(--pop);border:1px solid var(--sbtnb);box-shadow:0 4px 12px rgba(0,0,0,.25);font-size:12px;line-height:16px;color:var(--st1);white-space:nowrap}
.cdlg{width:420px;border-radius:8px;background:var(--surf);border:1px solid var(--sbtnb);box-shadow:0 16px 40px rgba(0,0,0,.35);overflow:hidden}
.cdlg .cb1{padding:24px}
.cdlg .ct{font-family:'Segoe UI Variable Display','Segoe UI',sans-serif;font-size:20px;font-weight:600;line-height:28px;margin-bottom:12px}
.cdlg .cf{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:24px;background:var(--win);border-top:1px solid var(--div)}
.cdlg .cf .sbt{justify-content:center}
.seg{display:inline-flex;padding:2px;border:1px solid var(--sbtnb);border-radius:6px;gap:0}
.seg span{height:28px;padding:0 12px;border-radius:4px;display:inline-flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
.seg span.sel{background:var(--ssel);font-weight:600}
.field{height:32px;min-width:240px;padding:0 11px;border-radius:4px;border:1px solid var(--sbtnb);border-bottom-color:var(--fieldb);background:var(--field);display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--st1)}
.listen{min-width:240px}
.listen .kc{height:22px}
.sbt.off{opacity:.45}
/* ---------- wave 3: Text snippets, Snap, App switcher ---------- */
.dark{--mz:rgba(255,255,255,.16);--crit:#C42B1C;--wall:#33404D;--wall2:#2A3440;--tb:rgba(32,32,32,.94)}
.light{--mz:rgba(0,0,0,.13);--crit:#C42B1C;--wall:#8FA3B5;--wall2:#7D93A6;--tb:rgba(238,238,238,.94)}
.field{width:300px}
.field .ph,.area .ph{color:var(--st3)}
.field.code,.trig,.area.code{font-family:'Cascadia Mono',Consolas,monospace;font-size:13px}
.field.ffoc{border-bottom:2px solid var(--sacc)}

/* ---------- the island ---------- */
const panel=(title,body,o={})=>`<div class="panel"><div class="hdr"><span class="ib back">${g('ChevronLeft',16)}</span><span class="ttl">${title}</span>${o.right||''}</div><div class="body">${body}</div></div>`;
const istage=c=>`<div class="${theme} stage" style="padding:24px">${c}</div>`;
const zone=(cols,rows,areas)=>`<div class="zs" style="grid-template-columns:${cols};grid-template-rows:${rows}">${areas.map(a=>`<span class="z" style="grid-area:${a}"></span>`).join('')}</div>`;
const pics=`<div class="pics">
 <div class="pic">${zone('1fr 1fr','1fr',['1/1','1/2'])}<span class="pn">Halves</span></div>
 <div class="pic">${zone('1fr 1fr 1fr','1fr',['1/1','1/2','1/3'])}<span class="pn">Thirds</span></div>
 <div class="pic">${zone('2fr 1fr','1fr',['1/1','1/2'])}<span class="pn">Wide left</span></div>
 <div class="pic">${zone('1fr 2fr','1fr',['1/1','1/2'])}<span class="pn">Wide right</span></div>
 <div class="pic">${zone('1fr 1fr','1fr 1fr',['1/1','1/2','2/1','2/2'])}<span class="pn">Quarters</span></div>
 <div class="pic">${zone('3fr 2fr','1fr 1fr',['1/1/3/2','1/2','2/2'])}<span class="pn">Coding</span></div></div>`;
const cmds=`<div class="cmds"><span class="cmd">${g('Maximize')}Maximize</span><span class="cmd">${g('Square')}Center</span><span class="cmd">${g('OtherScreen')}Next monitor</span><span class="cmd">${g('Undo')}Restore</span></div>`;
const snapMenu=panel('Snap',`<div class="topbar">${mono('Ch')}<span style="color:var(--tx)">Chrome</span></div>${pics}${cmds}`,{right:`<span class="hbtn">Arrangements${g('ChevronRight',12)}</span>`});
const ring=(f=.42)=>{const c=2*Math.PI*6;return `<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--hair)" stroke-width="2"/><circle cx="8" cy="8" r="6" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linecap="round" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 8 8)"/></svg>`;};
const SG={Ready:`<span class="sg ok">${g('Check',14)}</span>`,Opening:`<span class="sg">${ring(.3)}</span>`,Placing:`<span class="sg">${ring(.7)}</span>`,Waiting:'<span class="sg"></span>',Cancelled:'<span class="sg"></span>',bad:`<span class="sg cau">${g('TriangleAlert',14)}</span>`};
// a run's row: the window's title over its state; problems in Caution with a glyph, so color isn't alone
const prow=(w,s,o={})=>{const bad=/failed|Skipped/.test(s);const k=s.split(' ·')[0];
 return `<div class="prow"><span class="mono">${w[0]}</span><span class="tx"><div class="n">${w[2]}</div><div class="s${bad?' cau':k==='Waiting'||k==='Cancelled'?' w':''}">${s}</div></span>${bad?SG.bad:SG[k]||''}</div>`;};
const rng=(t)=>`<span class="rng"><span>${t}</span><span class="ib">${g('ChevronLeft',14)}</span><span class="ib">${g('ChevronRight',14)}</span></span>`;
const run=(title,status,rows,foot,o={})=>panel(title,`<div class="topbar"><span${o.cau?' class="cau"':''} style="${o.cau?'':'color:var(--tx2)'}">${status}</span>${o.range?rng(o.range):''}</div><div class="rows" style="grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(5,42px)">${rows.join('')}</div><div class="foot">${o.line?`<span class="ln">${o.line}</span>`:''}${foot}</div>`);
const ib=(t,acc)=>`<button class="ibtn${acc?' acc':''}">${t}</button>`;
const RUN={
 running:run('Coding','5 of 12 ready',[prow(W[0],'Ready'),prow(W[1],'Ready'),prow(W[2],'Ready'),prow(W[3],'Ready'),prow(W[4],'Ready'),prow(W[5],'Placing'),prow(W[6],'Opening'),prow(W[7],'Opening'),prow(W[8],'Waiting'),prow(W[9],'Waiting')],ib('Cancel'),{range:'1–10 of 12'}),
 partial:run('Coding','9 of 12 ready · 3 need attention',[prow(W[8],'Launching failed · Not found'),prow(W[11],'Skipped · Needs admin'),prow(W[10],'Launching failed · Timed out'),prow(W[0],'Ready'),prow(W[1],'Ready'),prow(W[2],'Ready'),prow(W[3],'Ready'),prow(W[4],'Ready'),prow(W[5],'Ready'),prow(W[6],'Ready')],ib('Dismiss')+ib('Retry',1),{cau:1,range:'1–10 of 12'}),
 guessed:run('Coding','12 of 12 ready · 2 guessed',[prow(W[3],'Ready · Nearest of 2'),prow(W[5],'Ready · Nearest of 2'),prow(W[0],'Ready'),prow(W[1],'Ready'),prow(W[2],'Ready'),prow(W[4],'Ready'),prow(W[6],'Ready'),prow(W[7],'Ready'),prow(W[8],'Ready'),prow(W[9],'Ready')],ib('Dismiss'),{range:'1–10 of 12'}),
 display:run('Coding','12 of 12 ready',[prow(W[6],'Ready · On DELL U2723QE'),prow(W[7],'Ready · On DELL U2723QE'),prow(W[8],'Ready · On DELL U2723QE'),prow(W[9],'Ready · On DELL U2723QE'),prow(W[10],'Ready · On DELL U2723QE'),prow(W[11],'Ready · On DELL U2723QE'),prow(W[0],'Ready'),prow(W[1],'Ready'),prow(W[2],'Ready'),prow(W[3],'Ready')],ib('Dismiss'),{range:'1–10 of 12',line:'Laptop display not connected'}),
 stopped:run('Coding','Stopped · Fullscreen app',[prow(W[5],'Cancelled'),prow(W[6],'Cancelled'),prow(W[7],'Cancelled'),prow(W[8],'Cancelled'),prow(W[9],'Cancelled'),prow(W[0],'Ready'),prow(W[1],'Ready'),prow(W[2],'Ready'),prow(W[3],'Ready'),prow(W[4],'Ready')],ib('Dismiss')+ib('Launch',1),{cau:1,range:'1–10 of 12'}),
 cancelled:run('Coding','5 ready · 7 cancelled',[prow(W[5],'Cancelled'),prow(W[6],'Cancelled'),prow(W[7],'Cancelled'),prow(W[8],'Cancelled'),prow(W[9],'Cancelled'),prow(W[0],'Ready'),prow(W[1],'Ready'),prow(W[2],'Ready'),prow(W[3],'Ready'),prow(W[4],'Ready')],ib('Dismiss')+ib('Launch',1),{range:'1–10 of 12'}),
 page2:run('Coding','9 of 12 ready · 3 need attention',[prow(W[7],'Ready'),prow(W[9],'Ready')],ib('Dismiss')+ib('Retry',1),{cau:1,range:'11–12 of 12'})
};
// Actions › Snap › Arrangements: each name launches; Manage opens Settings › Snap
const arow=(a,o={})=>`<div class="prow${o.hov?' hov':''}">${g('Snap',16)}<span class="tx"><div class="n">${a[0]}</div><div class="s">${a[2].replace(' · 2 displays','')}</div></span>${o.hov?'<span class="vb">Launch</span>':''}</div>`;
const arrMenu=panel('Arrangements',`<div class="rows" style="top:0;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(5,42px)">${arow(ARR[0],{hov:1})+arow(ARR[1])+arow(ARR[2])}</div><div class="foot">${ib('Manage')}</div>`);
const arrMenuEmpty=panel('Arrangements',`<div class="iempty">${g('Snap',24)}No arrangements</div><div class="foot">${ib('Manage')}</div>`);
// the bar: a run is an activity; its status over the arrangement's name
const barRun=(t,a,o={})=>`<div class="${theme} desk2"><div class="bar"><span style="width:8px"></span><span class="lead${o.cau?' cau':''}">${o.ring?`<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="var(--hair)" stroke-width="2.5"/><circle cx="12" cy="12" r="9" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="${(56.5*o.ring).toFixed(1)} 56.5" transform="rotate(-90 12 12)"/></svg>`:g(o.cau?'TriangleAlert':'Snap',16)}</span><span style="width:10px"></span><span class="lines"><span class="bt${o.cau?' cau':''}">${t}</span><span class="ba">${a}</span></span><span style="width:10px"></span><span class="pet"><span class="puckdot"></span></span></div></div>`;
// Search: an arrangement is a result whose verb is Launch
const isr=(lead,nm,dt,o={})=>`<div class="isr${o.sel?' sel':''}"><span class="ld">${lead}</span><span><div class="nm">${nm}</div><div class="dt">${dt}</div></span>${o.sel?`<span class="vb">${o.verb}</span>`:''}</div>`;
const iSearch=`<div class="panel" style="height:auto"><div class="hdr" style="height:32px"><button class="ib back" aria-label="Back">${g('ChevronLeft',16)}</button><span class="sfield">cod</span></div><div style="margin-top:8px">${isr(g('Snap'),'Coding','Arrangement · 12 windows',{sel:1,verb:'Launch'})+isr(mono('VS'),'Visual Studio Code','App')+isr(g('Snap'),'Coding','Snap layout')+isr(g('Folder'),'code','X:\\')}</div></div>`;

const B={
 'arrangements':()=>frame(arrPage(),'snap'),
 'arrangements-narrow':()=>frame(arrPage(),'snap',{narrow:1}),
 'arrangements-review':()=>frame(gapsCtx+sec('Arrangements')+card(editor(reviewNew)),'snap'),
 'arrangements-review-narrow':()=>frame(gapsCtx+sec('Arrangements')+card(editor(reviewNew)),'snap',{narrow:1}),
 'sheet-arrangements-states':()=>`<div class="srow">${stLabel('First install: no arrangements',st.empty)}${stLabel('An arrangement\'s menu',st.menu)}</div>
  <div class="srow">${stLabel('Launched from Settings: its row shows the run, Cancel takes Launch\'s place',st.launching)}${stLabel('Delete asks first',st.del)}</div>
  <div class="srow">${stLabel('Launch details: a program takes Arguments and a Working folder, a Start menu app has neither',st.details)}${stLabel('Refused: a window with no app to launch',st.missing)}</div>
  <div class="srow">${stLabel('Refused: another arrangement has the name',st.clash)}${stLabel('Every window removed',st.none)}</div>
  <div class="srow">${stLabel('Edit: the shortcut shows read-only, Edit opens it in Settings › Shortcuts',st.edit)}${stLabel('Recapture: a new draft, saved only on Save',st.recap)}</div>`,
 'sheet-arrangements-island':()=>`<div class="srow">${L('Actions › Snap: Arrangements in the header',istage(snapMenu))}${L('Arrangements: a name launches it',istage(arrMenu))}${L('No arrangements',istage(arrMenuEmpty))}</div>
  <div class="srow">${L('Search: an arrangement launches',istage(iSearch))}${L('Launching',istage(RUN.running))}${L('Partly done: problems first, Retry runs only those',istage(RUN.partial))}</div>
  <div class="srow">${L('Partly done, page 2',istage(RUN.page2))}${L('Guessed windows: the nearest of two',istage(RUN.guessed))}${L('A missing display: its windows go to the one you launched from',istage(RUN.display))}</div>
  <div class="srow">${L('Cancelled',istage(RUN.cancelled))}${L('Stopped: a fullscreen app came to the front',istage(RUN.stopped))}</div>
  <div class="srow">${L('On the bar: launching',barRun('5 of 12 ready','Coding',{ring:5/12}))}${L('Partly done, until Dismiss',barRun('9 of 12 ready','Coding · 3 need attention',{cau:1}))}${L('Done with guesses',barRun('12 of 12 ready','Coding · 2 guessed'))}${L('Refused: nothing launched',barRun('Not launched','Coding · Fullscreen app',{cau:1}))}</div>`
};
document.body.className=theme;
const html=B[board]();
const wrap=board.startsWith('sheet')?`<div class="sheet ${theme==='light'?'lt':''}"><div class="${theme}" style="display:contents">${html}</div></div>`:`<div style="display:inline-block;padding:24px;background:${theme==='light'?'#D9D9D9':'#161616'}"><div class="${theme}">${html}</div></div>`;
document.getElementById('root').innerHTML=wrap;
const el=document.getElementById('root').firstElementChild;
document.body.dataset.size=Math.ceil(el.getBoundingClientRect().width)+','+Math.ceil(el.getBoundingClientRect().height);
</script>
</body>
</html>
