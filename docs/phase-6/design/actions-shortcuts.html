<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chippi Phase 6: Actions and Shortcuts mockup</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;margin:0}
svg.g{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}

/* ---------- island tokens (Chippi.UI/Themes Dark.xaml / Light.xaml) ---------- */
.dark{--fill:rgba(40,40,44,.961);--bord:rgba(255,255,255,.09);--hair:rgba(255,255,255,.078);--face:rgba(255,255,255,.024);--faceh:rgba(255,255,255,.10);--cardb:rgba(255,255,255,.059);
 --btn:rgba(255,255,255,.071);--btnh:rgba(255,255,255,.09);--ctlb:rgba(255,255,255,.09);--hov:rgba(255,255,255,.059);--muted:rgba(255,255,255,.28);
 --tx:#FFFFFF;--tx2:#C9C9C9;--tx3:#9A9A9A;--acc:#B79CFF;--accf:linear-gradient(135deg,#B78FFF,#82AEFF);--tint:rgba(183,156,255,.14);--onacc:#170F2E;--cau:#FF99A4;--warn:#FCE100;
 --shadow:0 16px 40px rgba(0,0,0,.5);--desk:#1F1F1F;--zone:rgba(255,255,255,.085);--mono:rgba(183,156,255,.16);
 /* Settings */
 --win:#202020;--surf:#2B2B2B;--sbord:rgba(255,255,255,.031);--div:rgba(255,255,255,.059);--st1:#FFFFFF;--st2:#C5C5C5;--st3:#ABABAB;--st4:#9D9D9D;
 --shov:rgba(255,255,255,.039);--ssel:rgba(255,255,255,.059);--sbtn:rgba(255,255,255,.059);--sbtnh:rgba(255,255,255,.09);--sbtnb:rgba(255,255,255,.09);--sacc:#B79CFF;--sonacc:#000;--swarn:#FCE100;--pop:#2C2C2C;--field:rgba(255,255,255,.059);--fieldb:rgba(255,255,255,.55)}
.light{--fill:rgba(245,245,246,.961);--bord:rgba(0,0,0,.078);--hair:rgba(0,0,0,.078);--face:rgba(255,255,255,.45);--faceh:#FFFFFF;--cardb:rgba(0,0,0,.059);
 --btn:rgba(255,255,255,.86);--btnh:#F6F6F6;--ctlb:rgba(0,0,0,.09);--hov:rgba(0,0,0,.043);--muted:rgba(0,0,0,.18);
 --tx:#1A1A1A;--tx2:#5C5C5C;--tx3:#707070;--acc:#7444F0;--accf:linear-gradient(135deg,#8F5CFF,#5B86FF);--tint:rgba(116,68,240,.10);--onacc:#FFFFFF;--cau:#C42B1C;--warn:#9D5D00;
 --shadow:0 16px 40px rgba(0,0,0,.2);--desk:#1F1F1F;--zone:rgba(0,0,0,.07);--mono:rgba(116,68,240,.12);
 --win:#F3F3F3;--surf:#FBFBFB;--sbord:rgba(0,0,0,.059);--div:rgba(0,0,0,.071);--st1:#1A1A1A;--st2:#404040;--st3:#5D5D5D;--st4:#616161;
 --shov:rgba(0,0,0,.039);--ssel:rgba(0,0,0,.055);--sbtn:#FFFFFF;--sbtnh:#F6F6F6;--sbtnb:rgba(0,0,0,.10);--sacc:#6B4FBB;--sonacc:#FFF;--swarn:#9D5D00;--pop:#F9F9F9;--field:#FFFFFF;--fieldb:rgba(0,0,0,.45)}

/* ---------- sheet ---------- */
.sheet{display:inline-flex;flex-direction:column;gap:28px;padding:32px;background:#161616;color:#E6E6E6}
.sheet.lt{background:#D9D9D9;color:#1A1A1A}
.srow{display:flex;gap:28px;align-items:flex-start}
.cap{font-size:13px;line-height:18px;font-weight:600;margin:0 0 8px}
.cap span{font-weight:400;opacity:.7}
.stage{background:var(--desk);padding:24px 32px 40px;border-radius:2px}

/* ---------- island panel 520x360 ---------- */
.panel{position:relative;width:520px;height:360px;padding:12px;background:var(--fill);border:1px solid var(--bord);border-radius:8px;box-shadow:var(--shadow);color:var(--tx);font-size:12px;line-height:16px;overflow:hidden}
.hdr{display:flex;align-items:center;height:24px;margin-bottom:8px}
.ib{width:28px;height:24px;display:inline-flex;align-items:center;justify-content:center;border:0;padding:0;border-radius:4px;background:transparent;color:var(--tx2)}
.ib.back{margin:0 4px 0 -4px}
.ttl{flex:1;font-size:14px;font-weight:600;line-height:20px;white-space:nowrap}
.body{position:relative;width:494px;height:302px}
.grid{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.tile{position:relative;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;border:1px solid var(--cardb);border-radius:6px;background:var(--face);color:var(--tx)}
.grid.r4 .tile{height:61px}
.tile .lb{font-size:12px;font-weight:600;line-height:16px;margin:3px 2px 0}
.tile .st{font-size:11px;line-height:14px;margin:1px 3px 0;color:var(--tx2);white-space:nowrap}
.tile .chev{position:absolute;top:7px;right:6px}
.tile.on{background:var(--accf);border-color:transparent;color:var(--onacc)}
.tile.on .st{color:var(--onacc)}
.tile.hov{background:var(--faceh)}
.tile.dis{opacity:.5}
.tile.new::after{content:"";position:absolute;left:6px;top:6px;width:6px;height:6px;border-radius:3px;background:var(--acc)}
.foc{outline:2px solid var(--tx);outline-offset:1px}

/* list pages */
.topbar{display:flex;align-items:center;height:28px;gap:8px;font-size:11px;color:var(--tx3);white-space:nowrap}
.topbar .cau{color:var(--cau)}
.rows{position:absolute;left:0;right:0;top:34px;display:grid;column-gap:8px}
.row{height:42px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:4px;color:var(--tx);border:0;background:transparent;text-align:left;width:100%}
.row.hov{background:var(--hov)}
.row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app{height:42px;display:flex;align-items:center;gap:8px;padding:0 3px 0 5px;border-radius:4px}
.mono{width:16px;height:16px;border-radius:3px;background:var(--mono);color:var(--acc);font-size:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-right:2px}
.badge{height:18px;padding:0 6px;border-radius:4px;background:var(--btn);font-size:11px;font-weight:600;color:var(--tx2);display:inline-flex;align-items:center;white-space:nowrap}
.badge.cau{color:var(--cau)}
.x{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;color:var(--tx2);flex:none}
.ibtn{height:28px;padding:0 11px;border-radius:4px;border:1px solid var(--ctlb);background:var(--btn);font-size:12px;color:var(--tx);white-space:nowrap}
.foot{position:absolute;right:0;bottom:0;left:0;display:flex;gap:8px;justify-content:flex-end}
.foot .l{margin-right:auto}
/* island switch 34x18 */
.isw{width:34px;height:18px;border-radius:9px;border:1px solid var(--tx3);position:relative;flex:none}
.isw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:6px;background:var(--tx2)}
.isw.on{background:var(--accf);border-color:transparent}
.isw.on::after{left:auto;right:2px;background:var(--onacc)}
.rowst{font-size:11px;color:var(--tx3);margin-right:6px}

/* snap pictures */
.pics{position:absolute;left:0;right:0;top:34px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pic{height:98px;padding:6px 6px 0;border:1px solid var(--cardb);border-radius:6px;background:var(--face);display:flex;flex-direction:column}
.zs{flex:1;display:grid;gap:3px}
.z{border-radius:3px;background:var(--zone);border:1px solid transparent}
.z.hov{background:var(--tint);border-color:var(--acc)}
.pic .pn{height:20px;font-size:11px;line-height:20px;color:var(--tx3);white-space:nowrap}
.pics.off{opacity:.5}
.cmds{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cmd{height:42px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--cardb);border-radius:6px;background:var(--face);font-size:12px;color:var(--tx)}
.cmds.off{opacity:.5}

/* ---------- Settings ---------- */
.sw{width:1120px;background:var(--win);color:var(--st1);font-size:14px;line-height:20px;border:1px solid rgba(128,128,128,.35);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.sw.narrow{width:860px}
.tbar{height:40px;display:flex;align-items:center;flex:none}
.tbar .logo{width:16px;height:16px;border-radius:8px;background:linear-gradient(135deg,#B78FFF,#82AEFF);margin:0 12px 0 16px}
.tbar .tt{flex:1;font-size:12px}
.tbar .cb{width:46px;height:40px;display:flex;align-items:center;justify-content:center}
.shell{display:flex;flex:1}
.side{width:272px;flex:none;padding:12px 4px 0 4px}
.side.rail{width:48px;padding:4px 4px 0}
.find{height:32px;margin:0 12px 8px;padding:0 10px;border-radius:4px;background:var(--field);border:1px solid var(--sbtnb);border-bottom-color:var(--fieldb);display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--st4)}
.gl{font-size:12px;font-weight:600;color:var(--st3);padding:12px 16px 4px;line-height:16px}
.gl:first-of-type{padding-top:0}
.nav{position:relative;height:32px;margin:2px 4px;padding:0 12px;border-radius:4px;display:flex;align-items:center;gap:12px;white-space:nowrap}
.nav.sel{background:var(--ssel);font-weight:600}
.nav.sel::before{content:"";position:absolute;left:0;top:8px;width:3px;height:16px;border-radius:2px;background:var(--sacc)}
.rail .nav{padding:0;justify-content:center;margin:2px 0}
.rail .hl{height:1px;background:var(--div);margin:6px 8px}
.page{flex:1;padding:4px 40px 28px;min-width:0}
.ptitle{font-family:'Segoe UI Variable Display','Segoe UI',sans-serif;font-size:20px;font-weight:600;line-height:28px;margin:0 0 14px}
.sh{font-size:14px;font-weight:600;line-height:20px;margin:24px 0 8px}
.sh:first-of-type{margin-top:0}
.card{background:var(--surf);border:1px solid var(--sbord);border-radius:8px;position:relative}
.sr{min-height:48px;display:flex;align-items:center;padding:8px 16px;gap:12px;border-top:1px solid var(--div)}
.sr:first-child{border-top:0}
.sr .lead{width:20px;height:20px;color:var(--st1);flex:none}
.sr .tl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .tl small{display:block;font-size:12px;line-height:16px;color:var(--st3)}
.sr .ctl{display:flex;align-items:center;gap:8px;flex:none}
.sr.hov{background:var(--shov)}
.sr.edit{background:var(--shov)}
.sr .mut{color:var(--st3)}
.sr .warn{color:var(--swarn);font-size:14px;display:flex;align-items:center;gap:6px}
.sbt{height:32px;padding:0 12px;border-radius:4px;border:1px solid var(--sbtnb);background:var(--sbtn);font-size:14px;color:var(--st1);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.sbt.acc{background:var(--sacc);border-color:var(--sacc);color:var(--sonacc)}
.sbt.icon{width:32px;padding:0;justify-content:center;background:transparent;border-color:transparent;color:var(--st2)}
.sbt.tog.on{background:var(--sacc);border-color:var(--sacc);color:var(--sonacc)}
.combo{height:32px;min-width:200px;padding:0 10px 0 11px;border-radius:4px;border:1px solid var(--sbtnb);background:var(--sbtn);display:inline-flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;white-space:nowrap}
.combo.open{border-color:var(--sacc)}
.combo .ph{color:var(--st3)}
.caps{display:flex;align-items:center;gap:4px}
.kc{height:24px;min-width:24px;padding:0 7px;border-radius:4px;border:1px solid var(--sbtnb);border-bottom-width:2px;background:var(--sbtn);font-size:12px;line-height:20px;color:var(--st1);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.kc.dim{color:var(--st3)}
.plus{font-size:12px;color:var(--st3)}
.ssw{width:40px;height:20px;border-radius:10px;border:1px solid var(--st2);position:relative;flex:none}
.ssw::after{content:"";position:absolute;left:3px;top:3px;width:12px;height:12px;border-radius:6px;background:var(--st2)}
.ssw.on{background:var(--sacc);border-color:var(--sacc)}
.ssw.on::after{left:auto;right:3px;top:2px;width:14px;height:14px;border-radius:7px;background:var(--sonacc)}
.listen{height:32px;min-width:290px;padding:0 11px;border-radius:4px;border:1px solid var(--sacc);box-shadow:inset 0 0 0 1px var(--sacc);background:var(--field);display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--st2)}
.pop{position:absolute;z-index:3;background:var(--pop);border:1px solid var(--sbtnb);border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.3);padding:4px;font-size:14px}
.pop .pf{height:32px;margin:4px 4px 6px;padding:0 10px;border-radius:4px;border:1px solid var(--sbtnb);border-bottom:2px solid var(--sacc);background:var(--field);display:flex;align-items:center;gap:8px}
.pop .pg{font-size:12px;font-weight:600;color:var(--st3);padding:8px 12px 2px}
.pop .pi{height:32px;padding:0 12px;border-radius:4px;display:flex;align-items:center;gap:12px;white-space:nowrap}
.pop .pi.hov{background:var(--shov)}
.pop .pi .k{margin-left:auto;font-size:12px;color:var(--st3)}
.infobar{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 8px 8px 16px;margin-bottom:8px;border-radius:8px;background:var(--surf);border:1px solid var(--sbord);color:var(--st1)}
.infobar .ic{color:var(--swarn)}
.infobar .t{flex:1}
.stcard{width:768px}
</style>
</head>

const g=(n,s=16)=>`<svg class="g" width="${s}" height="${s}" viewBox="0 0 24 24" stroke-width="${(30/s).toFixed(3)}"><path d="${P[n]}"/></svg>`;
const q=new URLSearchParams(location.search);
const board=q.get('board')||'sheet-actions', theme=q.get('theme')||'dark';

/* ---------- island ---------- */
const panel=(title,body,{edit=false}={})=>`<div class="panel"><div class="hdr"><span class="ib back">${g('ChevronLeft',16)}</span><span class="ttl">${title}</span>${edit?`<span class="ib">${g('Pencil',14)}</span>`:''}</div><div class="body">${body}</div></div>`;
const T=(glyph,label,status,o={})=>`<button class="tile${o.on?' on':''}${o.dis?' dis':''}${o.hov?' hov':''}${o.isNew?' new':''}${o.foc?' foc':''}">${g(glyph,18)}<span class="lb">${label}</span>${status?`<span class="st">${status}</span>`:''}${o.list?`<span class="chev">${g('ChevronRight',12)}</span>`:''}</button>`;
const base={
 dark:T('Moon','Dark','On',{on:1}),hidden:T('Eye','Hidden','Off'),icons:T('LayoutGrid','Icons','On',{on:1}),autohide:T('PanelBottom','Auto-hide','Off'),extend:T('Screens','Extend','On',{on:1}),
 bt:T('Bluetooth','Bluetooth','On',{on:1}),wifi:T('Wifi','Wi-Fi','On',{on:1}),cam:T('Camera','Camera','On',{on:1}),plan:T('Gauge','Plan','Balanced',{list:1}),
 lock:T('Lock','Lock'),displays:T('MonitorOff','Displays'),saver:T('ScreenSaver','Screensaver'),recycle:T('Trash','Recycle'),eject:T('Eject','Eject','2 drives',{list:1}),
 quit:T('SquareX','Quit','9 open',{list:1}),frozen:T('Snowflake','Frozen','None',{dis:1}),explorer:T('RefreshCw','Explorer'),power:T('Power','Power',null,{list:1}),cleaning:T('Droplet','Cleaning'),
 snap:T('Snap','Snap','Chrome',{list:1}),input:T('Mouse','Input','3 on',{list:1}),switcher:T('Switcher','Switcher','12 windows'),
 powerB:T('Power','Power',null,{list:1}),quitB:T('SquareX','Quit','9 open',{list:1})
};
const gallery=keys=>{const r=Math.ceil(keys.length/5);return panel('Actions',`<div class="grid${r>=4?' r4':''}">${keys.map(k=>base[k]).join('')}</div>`,{edit:1});};
const optA=['dark','hidden','icons','autohide','extend','bt','wifi','cam','plan','lock','displays','saver','recycle','eject','quit','explorer','power','snap','input','switcher'];
const optB=['dark','hidden','icons','autohide','extend','bt','wifi','cam','plan','input','snap','switcher','quit','eject','recycle','explorer','powerB','cleaning'];

const zone=(cols,rows,areas,hov,names)=>`<div class="zs" style="grid-template-columns:${cols};grid-template-rows:${rows}">${areas.map((a,i)=>`<span class="z${hov===i?' hov':''}" style="grid-area:${a}" title="${names[i]}"></span>`).join('')}</div>`;
const pics=(hov,off)=>`<div class="pics${off?' off':''}">
 <div class="pic">${zone('1fr 1fr','1fr',['1/1','1/2'],hov==='l'?0:-1,['Left half','Right half'])}<span class="pn">Halves</span></div>
 <div class="pic">${zone('1fr 1fr 1fr','1fr',['1/1','1/2','1/3'],-1,['Left third','Center third','Right third'])}<span class="pn">Thirds</span></div>
 <div class="pic">${zone('2fr 1fr','1fr',['1/1','1/2'],-1,['Left two-thirds','Right third'])}<span class="pn">Wide left</span></div>
 <div class="pic">${zone('1fr 2fr','1fr',['1/1','1/2'],-1,['Left third','Right two-thirds'])}<span class="pn">Wide right</span></div>
 <div class="pic">${zone('1fr 1fr','1fr 1fr',['1/1','1/2','2/1','2/2'],-1,['Top left','Top right','Bottom left','Bottom right'])}<span class="pn">Quarters</span></div>
 <div class="pic">${zone('3fr 2fr','1fr 1fr',['1/1/3/2','1/2','2/2'],-1,['Main','Top right','Bottom right'])}<span class="pn">Coding</span></div>
</div>`;
const cmds=off=>`<div class="cmds${off?' off':''}"><span class="cmd">${g('Maximize')}Maximize</span><span class="cmd">${g('Square')}Center</span><span class="cmd">${g('OtherScreen')}Next monitor</span><span class="cmd">${g('Undo')}Restore</span></div>`;
const snap=panel('Snap',`<div class="topbar"><span class="mono">Ch</span><span style="color:var(--tx2)">Chrome</span><span>Pull requests · tcurtsinger/Chippi</span></div>${pics('l')}${cmds()}`);
const snapAdmin=panel('Snap',`<div class="topbar"><span class="mono">Ta</span><span class="cau">Task Manager runs as admin, so it can't be moved</span></div>${pics(null,1)}${cmds(1)}`);
const snapFailed=panel('Snap',`<div class="topbar"><span class="mono">Ph</span><span style="color:var(--tx2)">Photos</span><span class="cau" style="margin-left:auto">Left half failed</span></div>${pics('l')}${cmds()}`);

const sw=(on)=>`<span class="isw${on?' on':''}"></span>`;
const IR=(glyph,name,on,o={})=>`<button class="row${o.hov?' hov':''}" role="switch">${g(glyph)}<span class="nm">${name}</span>${sw(on)}</button>`;
const input=panel('Input',`<div class="rows" style="top:0;grid-template-columns:1fr">
 ${IR('Pointer','Focus follows mouse',1)}${IR('Scroll','Smooth scrolling',1,{hov:1})}${IR('ShieldX','Close protection',1)}${IR('CapsLock','Caps Lock combos',0)}${IR('Gamepad','Always on in games',0)}</div>`);

const PR=(glyph,name,o={})=>`<button class="row${o.hov?' hov':''}">${g(glyph)}<span class="nm">${name}</span></button>`;
const powerB=panel('Power',`<div class="rows" style="grid-template-columns:1fr 1fr">
 ${PR('Lock','Lock',{hov:1})}${PR('Moon','Sleep')}${PR('MonitorOff','Turn off displays')}${PR('RefreshCw','Restart')}${PR('ScreenSaver','Screen saver')}${PR('Power','Shut down')}${PR('LogOut','Sign out')}</div>`);
const AR=(m,name,badges=[],o={})=>`<div class="app">${`<span class="mono">${m}</span>`}<span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis${o.dim?';color:var(--tx3)':''}">${name}</span>${badges.join('')}<span class="x">${g('Close',14)}</span></div>`;
const quitB=panel('Quit apps',`<div class="topbar">9 apps open · 1 not responding</div><div class="rows" style="grid-template-columns:1fr 1fr">
 ${AR('Ch','Chrome',['<span class="badge">Front</span>'])}${AR('St','Steam')}
 ${AR('Di','Discord',['<span class="badge">Kept</span>'])}${AR('Ou','Outlook',['<span class="badge cau">Not responding</span>'])}
 ${AR('ZW','Zoom Workplace')}${AR('Cl','Claude')}
 ${AR('Sp','Spotify',['<span class="badge">Kept</span>'])}${AR('WT','Windows Terminal')}
 ${AR('0F','007 First Light')}</div>
 <div class="foot"><button class="ibtn l">End Outlook</button><button class="ibtn">Quit all but Chrome</button><button class="ibtn">Quit all</button></div>`);

/* ---------- Settings ---------- */
const kc=(...k)=>`<span class="caps">${k.map(x=>x.startsWith('m:')?`<span class="kc">${g('Mouse',14)}${x.slice(2)}</span>`:`<span class="kc">${x}</span>`).join('')}</span>`;
const SR=(glyph,title,right,o={})=>`<div class="sr${o.cls?' '+o.cls:''}">${glyph?`<span class="lead">${g(glyph,20)}</span>`:''}<span class="tl">${title}${o.small?`<small>${o.small}</small>`:''}</span><span class="ctl">${right}</span></div>`;
const more=`<button class="sbt icon" aria-label="More options">${g('Ellipsis')}</button>`;
const binds=[
 ['Mic','Mute microphone',kc('Ctrl','Shift','M')],
 ['Search','Open Search',kc('Ctrl','Alt','Space')],
 ['Radial','Open Radial menu',kc('m:Hold middle button')],
 ['Moon','Dark mode',kc('Caps Lock','D')],
 ['Lock','Lock',kc('Caps Lock','L')],
 ['Type','Paste as plain text',`<span class="warn">${g('TriangleAlert')}In use by another app</span>`+kc('Ctrl','Shift','V')],
 ['Snippet','Insert Signature',kc('Caps Lock','S')],
 ['SnapLeft','Snap left half',kc('Caps Lock','←')],
 ['OtherScreen','Move to next monitor',kc('m:Forward button')],
 ['Switcher','Open App switcher',kc('m:Back button')],
];
const bindRows=list=>list.map(([gl,t,r])=>SR(gl,t,r+more)).join('');
const addRow=`${SR(null,'<span class="mut">10 shortcuts</span>',`<button class="sbt">${g('Plus')}Add shortcut</button>`)}`;
const capsCard=`<div class="card">
 ${SR('CapsLock','Caps Lock combos','<span class="mut" style="font-size:14px">On</span><span class="ssw on"></span>')}
 ${SR(null,'Acts as',`<button class="sbt tog on">Ctrl</button><button class="sbt tog on">Alt</button><button class="sbt tog on">Shift</button><button class="sbt tog">Win</button>`,{cls:'ind'})}
 ${SR(null,'Tap on its own',`<span class="combo">Nothing${g('ChevronDown',12)}</span>`)}
 ${SR(null,'Key to hold',`<span class="combo">Caps Lock${g('ChevronDown',12)}</span>`)}
</div>`;
const leaveCard=`<div class="card">
 ${SR(null,'<span style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:20px;height:20px;font-size:10px">RD</span>Remote Desktop</span>','<button class="sbt">Remove</button>')}
 ${SR(null,'<span style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:20px;height:20px;font-size:10px">St</span>Steam</span>','<button class="sbt">Remove</button>')}
 ${SR(null,'<span class="mut">2 apps</span>','<button class="sbt">Add app</button>')}
</div>`;
const shortcutsPage=`<div class="ptitle">Shortcuts</div>
 <div class="card">${bindRows(binds)}${addRow}</div>
 <div class="sh">Caps Lock</div>${capsCard}
 <div class="sh">Apps to leave alone</div>${leaveCard}`;
const N=(glyph,label,sel)=>`<div class="nav${sel?' sel':''}">${g(glyph)}${label}</div>`;
const sidebar=`<div class="side"><div class="find">Find a setting${g('Search',14)}</div>
 <div class="gl">Clipboard &amp; text</div>${N('Clipboard','Clipboard history')}${N('Type','Paste as plain text')}${N('Snippet','Text snippets')}
 <div class="gl">Windows</div>${N('Snap','Window layouts')}${N('Switcher','App switcher')}${N('Mouse','Mouse')}${N('Keyboard','Keyboard')}
 <div class="gl">Chippi</div>${N('Settings','General')}${N('Home','Island &amp; pet')}${N('Keyboard','Shortcuts',1)}${N('Bell','Notifications')}${N('Download','Add features')}${N('Info','About')}</div>`;
const rail=`<div class="side rail">${N('Menu','')}${N('Search','')}<div class="hl"></div>${N('Clipboard','')}${N('Type','')}${N('Snippet','')}<div class="hl"></div>${N('Snap','')}${N('Switcher','')}${N('Mouse','')}${N('Keyboard','')}<div class="hl"></div>${N('Settings','')}${N('Home','')}${N('Keyboard','',1)}${N('Bell','')}</div>`;
const frame=(content,narrow)=>`<div class="sw${narrow?' narrow':''}"><div class="tbar"><span class="logo"></span><span class="tt">Chippi Settings</span><span class="cb">${g('Minus',14)}</span><span class="cb">${g('Square',12)}</span><span class="cb">${g('Close',14)}</span></div><div class="shell">${narrow?rail:sidebar}<div class="page">${content}</div></div></div>`;

// card states
const head3=bindRows(binds.slice(7,10));
const picker=`<div class="pop" style="right:94px;top:200px;width:300px">
 <div class="pf">${g('Search',14)}<span style="color:var(--st1)">thi</span></div>
 <div class="pg">Snap</div>
 <div class="pi hov">${g('Snap')}Left third</div><div class="pi">${g('Snap')}Center third</div><div class="pi">${g('Snap')}Right third<span class="k">Caps Lock + →</span></div>
 <div class="pg">Snap · Coding</div><div class="pi">${g('Snap')}Main</div></div>`;
const stChoose=`<div class="card" style="overflow:visible">${head3}${SR('Plus','New shortcut',`<span class="combo open" style="min-width:300px"><span class="ph">Choose an action</span>${g('ChevronDown',12)}</span><button class="sbt">Cancel</button>`,{cls:'edit'})}${picker}</div><div style="height:236px"></div>`;
const stListen=`<div class="card">${head3}${SR('Snap','Snap left third',`<span class="listen">Press keys or a mouse button</span><button class="sbt">Cancel</button>`,{cls:'edit'})}</div>`;
const stClash=`<div class="card">${head3}${SR('Snap','Snap left third',`<span class="warn">${g('TriangleAlert')}Snap left half already uses this</span><span class="listen" style="min-width:0">${kc('Caps Lock','←')}</span><button class="sbt">Cancel</button>`,{cls:'edit'})}</div>`;
const stSaved=`<div class="card">${head3}${SR('Snap','Snap left third',kc('Caps Lock','1')+more,{cls:'hov'})}${SR(null,'<span class="mut">11 shortcuts</span>',`<button class="sbt">${g('Plus')}Add shortcut</button>`)}</div>`;
const stEmpty=`<div class="card">${SR(null,'<span class="mut">No shortcuts</span>',`<button class="sbt">${g('Plus')}Add shortcut</button>`)}</div>`;
const stFailed=`<div class="infobar"><span class="ic">${g('TriangleAlert',20)}</span><span class="t">Caps Lock and mouse shortcuts failed</span><button class="sbt">Retry</button></div><div class="card">${head3}</div>`;
const menu=`<div class="card" style="overflow:visible">${bindRows(binds.slice(7,9))}${SR('Switcher','Open App switcher',kc('m:Back button')+`<button class="sbt icon" style="background:var(--shov)">${g('Ellipsis')}</button>`,{cls:'hov'})}
 <div class="pop" style="right:16px;top:142px;width:200px"><div class="pi hov">Change</div><div class="pi">Add another</div><div class="pi">Remove</div></div></div><div style="height:120px"></div>`;
const stLabel=(t,c)=>`<div><div class="cap">${t}</div><div class="${theme} stage" style="padding:16px;background:var(--win)"><div class="stcard" style="color:var(--st1);font-size:14px;line-height:20px">${c}</div></div></div>`;

/* ---------- boards ---------- */
const cropReal=(file)=>`<div class="panel" style="padding:0;border:0;box-shadow:var(--shadow)"><img src="before/${theme}-${file}.png" style="position:absolute;left:-40px;top:-40px"></div>`;
const L=(t,html)=>`<div><div class="cap">${t}</div><div class="stage">${html}</div></div>`;
const B={
 'sheet-actions':()=>`<div class="srow">${L('Today <span>(real render, 18 actions)</span>',cropReal('actions-all'))}${L('A · Add Snap, Input, Switcher <span>(20 of 22 fit; Frozen and Cleaning left out)</span>',gallery(optA))}${L('B · Also regroup today\'s <span>(recommended, 18 tiles)</span>',gallery(optB))}</div>`,
 'sheet-menus':()=>`<div class="srow">${L('Snap <span>(pointing at Left half)</span>',snap)}${L('Input',input)}</div><div class="srow">${L('Power <span>(B: Lock, Turn off displays, Screen saver join it)</span>',powerB)}${L('Quit apps <span>(B: End frozen apps joins it)</span>',quitB)}</div>`,
 'sheet-snap-states':()=>`<div class="srow">${L('Snap · an admin window in front',snapAdmin)}${L('Snap · a move failed',snapFailed)}</div>`,
 'settings':()=>frame(shortcutsPage),
 'settings-narrow':()=>frame(shortcutsPage,1),
 'sheet-shortcut-states':()=>`<div class="srow">${stLabel('1 · Add shortcut: choose an action',stChoose)}${stLabel('2 · Then press the input',stListen)}</div>
  <div class="srow">${stLabel('3 · Taken by another action: stays listening',stClash)}${stLabel('4 · Saved',stSaved)}</div>
  <div class="srow">${stLabel('Row menu',menu)}<div style="display:flex;flex-direction:column;gap:28px">${stLabel('No shortcuts yet',stEmpty)}${stLabel('The input hook is down: key shortcuts still work',stFailed)}</div></div>`
};
document.body.className=theme;
const html=B[board]();
const wrap=board.startsWith('sheet')?`<div class="sheet ${theme==='light'?'lt':''}"><div class="${theme}" style="display:contents">${html}</div></div>`:`<div style="display:inline-block;padding:24px;background:${theme==='light'?'#D9D9D9':'#161616'}">${html}</div>`;
document.getElementById('root').innerHTML=wrap;
const el=document.getElementById('root').firstElementChild;
document.body.dataset.size=Math.ceil(el.getBoundingClientRect().width)+','+Math.ceil(el.getBoundingClientRect().height);
</script>
</body>
</html>
