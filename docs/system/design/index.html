<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System page mockup</title>
<style>
:root {
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
}
/* Island tokens: the Island* brushes in src/Chippi.UI/Themes/Dark.xaml and Light.xaml. */
.dark {
  --backdrop: #141418; --island: rgba(40,40,44,.96); --island-border: rgba(255,255,255,.09);
  --card: rgba(255,255,255,.05); --card-border: rgba(255,255,255,.06); --hair: rgba(255,255,255,.08);
  --hover: rgba(255,255,255,.06); --hover-border: rgba(255,255,255,.2); --press: rgba(255,255,255,.04);
  --track: rgba(255,255,255,.14); --fill: #C9C9C9; --muted: rgba(255,255,255,.18);
  --text: #FFFFFF; --text2: #C9C9C9; --text3: #9A9A9A;
  --accent: #B79CFF; --accent-tint: rgba(183,156,255,.14); --caution: #FCE100;
  --shadow: 0 16px 40px rgba(0,0,0,.5);
  /* Settings */
  --s-window: #202020; --s-card: #2B2B2B; --s-stroke: rgba(255,255,255,.03); --s-divider: rgba(255,255,255,.06);
  --s-text: #FFFFFF; --s-text2: #C5C5C5; --s-caption: #ABABAB; --s-control: rgba(255,255,255,.06);
  --s-control-stroke: rgba(255,255,255,.09); --s-accent: #4CC2FF; --s-on-accent: #000; --s-track: rgba(255,255,255,.12);
  --s-off-stroke: rgba(255,255,255,.6); --s-off-knob: rgba(255,255,255,.8);
  color-scheme: dark;
}
.light {
  --backdrop: #DCDDE3; --island: rgba(245,245,246,.96); --island-border: rgba(0,0,0,.09);
  --card: rgba(255,255,255,.74); --card-border: rgba(0,0,0,.06); --hair: rgba(0,0,0,.08);
  --hover: rgba(0,0,0,.043); --hover-border: rgba(0,0,0,.2); --press: rgba(0,0,0,.06);
  --track: rgba(0,0,0,.12); --fill: #5C5C5C; --muted: rgba(0,0,0,.12);
  --text: #1A1A1A; --text2: #5C5C5C; --text3: #707070;
  --accent: #7444F0; --accent-tint: rgba(116,68,240,.10); --caution: #9D5D00;
  --shadow: 0 16px 40px rgba(0,0,0,.2);
  --s-window: #F3F3F3; --s-card: #FBFBFB; --s-stroke: rgba(0,0,0,.06); --s-divider: rgba(0,0,0,.07);
  --s-text: #1A1A1A; --s-text2: #404040; --s-caption: #5D5D5D; --s-control: #FFFFFF;
  --s-control-stroke: rgba(0,0,0,.1); --s-accent: #005FB8; --s-on-accent: #fff; --s-track: rgba(0,0,0,.1);
  --s-off-stroke: rgba(0,0,0,.55); --s-off-knob: rgba(0,0,0,.6);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); font-size: 12px; -webkit-font-smoothing: antialiased; background: #0f0f12; color: #eee; }
body.review { background: #18181b; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; text-align: left; cursor: pointer; }
svg.i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Island ---------- */
.stage { background: var(--backdrop); padding: 24px; display: inline-block; }
.panel { width: 520px; height: 360px; border-radius: 8px; background: var(--island); color: var(--text);
  box-shadow: inset 0 0 0 1px var(--island-border), var(--shadow); padding: 12px; overflow: hidden; position: relative; }
.head { height: 24px; display: flex; align-items: center; gap: 4px; }
.back { width: 24px; height: 24px; border-radius: 4px; display: grid; place-items: center; color: var(--text2); }
.back:hover { background: var(--hover); }
.back svg { width: 16px; height: 16px; }
.title { font-size: 13px; font-weight: 600; }
.head .pick { margin-left: auto; display: flex; align-items: center; gap: 4px; height: 24px; padding: 0 6px; border-radius: 4px; color: var(--text3); max-width: 240px; }
.head .pick span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head .pick:hover { background: var(--hover); }
.head .pick svg { width: 12px; height: 12px; }
.body { margin-top: 8px; width: 496px; height: 304px; position: relative; }
.page { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px; }
.page.enter { animation: enter 180ms cubic-bezier(.2,.8,.2,1); }
.page.enter.from-left { animation-name: enter-left; }
@keyframes enter { from { transform: translateX(12px); opacity: 0; } }
@keyframes enter-left { from { transform: translateX(-12px); opacity: 0; } }
.row { display: flex; gap: 8px; }

.card { background: var(--card); border-radius: 6px; box-shadow: inset 0 0 0 1px var(--card-border); padding: 10px 12px; position: relative; }
button.w { display: flex; flex-direction: column; background: var(--card); border-radius: 6px; box-shadow: inset 0 0 0 1px var(--card-border); padding: 10px 12px; transition: background 120ms, box-shadow 120ms; position: relative; overflow: hidden; }
button.w:hover, button.w.hover { background: linear-gradient(var(--hover), var(--hover)), var(--card); box-shadow: inset 0 0 0 1px var(--hover-border); }
button.w:active { background: linear-gradient(var(--press), var(--press)), var(--card); }
button.w:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; }
.top { display: flex; align-items: center; gap: 6px; height: 16px; color: var(--text3); font-size: 12px; min-width: 0; }
.top .name { white-space: nowrap; }
.top .fact { margin-left: auto; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hero { font-family: var(--display); font-weight: 600; font-size: 24px; line-height: 30px; margin-top: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; letter-spacing: -.01em; display: flex; align-items: baseline; }
.hero .u { font-size: 14px; color: var(--text2); margin-left: 2px; letter-spacing: 0; }
.hero .u.sp { margin-left: 4px; }
.hero svg.arrow { width: 16px; height: 16px; color: var(--text3); align-self: center; margin-right: 4px; stroke-width: 2.25; }
.ctx { font-size: 11px; line-height: 16px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 3px; }
.ctx svg.arrow { width: 11px; height: 11px; stroke-width: 2.5; }
.meter { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; margin-top: auto; }
.meter i { display: block; height: 100%; border-radius: 2px; background: var(--fill); }
.caution .hero, .caution .hero .u { color: var(--caution); }
.caution .meter i, .meter.caution i { background: var(--caution); }

/* A widget's graph: under the value and its context line, out to the card's edges (inside its 1px border). */
.spark { position: absolute; left: 1px; bottom: 1px; display: block; }
.spark.side { left: auto; right: 1px; }
.pairv { display: flex; gap: 16px; margin-top: 4px; }
.pairv .hero { margin: 0; }

/* Drives: rows of 20, two to a line, the fullest kept when they don't all fit. */
.drows { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; margin-top: 4px; }
.drows.one { grid-template-columns: 1fr; }
.dr { height: 20px; display: grid; grid-template-columns: 20px 1fr auto; column-gap: 8px; align-items: center; min-width: 0; }
.dr .k { color: var(--text2); }
.dr .meter { margin: 0; }
.dr .t { font-size: 11px; color: var(--text3); white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; min-width: 76px; }
.dr .t b { font-size: 12px; font-weight: 600; color: var(--text); }
.dr.caution .t b { color: var(--caution); }
.dr.more { display: flex; color: var(--text2); }

/* Detail pages */
.gcard { overflow: hidden; }
.gcard .graph { position: absolute; left: 1px; top: 46px; }
.hrow { display: flex; align-items: baseline; gap: 12px; height: 36px; }
.hrow .hero { font-size: 32px; line-height: 36px; margin: 0; }
.hrow .hero .u { font-size: 18px; }
.hrow .side { margin-left: auto; align-self: flex-end; margin-bottom: 1px; display: flex; flex-direction: column; align-items: flex-end; font-size: 12px; line-height: 16px; color: var(--text2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.hrow .side .sc { font-size: 10px; line-height: 13px; color: var(--text3); }
.graph .scale { font-size: 10px; fill: var(--text3); font-family: var(--font); }
.gfoot { position: absolute; left: 12px; right: 12px; bottom: 10px; height: 18px; }
.strip { height: 18px; display: flex; gap: 3px; }
.strip i { flex: 1; background: var(--track); border-radius: 2px; position: relative; overflow: hidden; }
.strip i b { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); }
.mline { height: 18px; display: flex; flex-direction: column; justify-content: space-between; }
.mline .l { display: flex; font-size: 11px; line-height: 12px; color: var(--text3); }
.mline .l span:last-child { margin-left: auto; color: var(--text2); font-variant-numeric: tabular-nums; }
.mline .meter { margin: 0; }
.legend { height: 18px; display: flex; align-items: center; gap: 14px; font-size: 11px; color: var(--text3); }
.legend .sw { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--accent); margin-right: 6px; vertical-align: middle; }
.legend .sw.dash { border-top: 2px dashed var(--text2); }
.legend .r { margin-left: auto; }
.lbl { font-size: 11px; line-height: 16px; height: 16px; color: var(--text3); display: flex; }
.lbl span + span { margin-left: auto; }
.boardsheet .stage { background: transparent; padding: 0; }
.rows { display: flex; flex-direction: column; margin-top: 2px; }
.r { height: 28px; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--hair); min-width: 0; }
.r:first-child { border-top: 0; }
.r .k { color: var(--text3); white-space: nowrap; }
.r .v { margin-left: auto; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.r .v.reg { font-weight: 400; color: var(--text2); }
.r .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tile { width: 16px; height: 16px; border-radius: 4px; flex: none; display: grid; place-items: center; font-size: 8px; font-weight: 700; color: #fff; letter-spacing: -.02em; }
.adapter { height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 8px; margin: 0 -8px; border-radius: 4px; width: calc(100% + 16px); }
.adapter:hover { background: var(--hover); }
.adapter.on { background: var(--accent-tint); }
.adapter .nm { flex: 1; }
.adapter .rate { width: 92px; text-align: right; font-variant-numeric: tabular-nums; display: flex; align-items: center; justify-content: flex-end; gap: 3px; color: var(--text2); }
.adapter .rate svg { width: 11px; height: 11px; color: var(--text3); stroke-width: 2.5; }
.adapter .off { color: var(--text3); width: 187px; text-align: right; }
.vols { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; margin-top: 2px; }
.vols.one { grid-template-columns: 1fr; }
.vol { height: 36px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
.vol .l { display: flex; align-items: baseline; gap: 8px; }
.vol .k { color: var(--text2); }
.vol .t { margin-left: auto; font-size: 11px; color: var(--text3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.vol .t b { font-size: 12px; color: var(--text); font-weight: 600; }
.vol .meter { margin: 0; }
.vol.caution .t b { color: var(--caution); }
.zones { display: grid; gap: 8px; margin-top: 2px; }
.zone { border-radius: 4px; background: var(--hover); padding: 6px 8px; height: 44px; }
.zone .k { font-size: 11px; color: var(--text3); }
.zone .v { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- Settings ---------- */
.settings { width: 824px; background: var(--s-window); color: var(--s-text); padding: 24px 32px 32px; font-size: 14px; }
.s-title { font-family: var(--display); font-size: 28px; font-weight: 600; line-height: 36px; margin: 0 0 16px; }
.s-sec { font-size: 14px; font-weight: 600; line-height: 20px; margin: 24px 0 8px; }
.s-card { background: var(--s-card); border-radius: 8px; box-shadow: inset 0 0 0 1px var(--s-stroke); }
.s-row { min-height: 48px; padding: 10px 16px; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--s-divider); }
.s-row:first-child { border-top: 0; }
.s-row .lab { flex: 1; }
.s-row .cap { font-size: 12px; color: var(--s-caption); }
.combo { width: 240px; height: 32px; border-radius: 4px; background: var(--s-control); box-shadow: inset 0 0 0 1px var(--s-control-stroke); display: flex; align-items: center; padding: 0 12px; font-size: 14px; gap: 8px; }
.combo span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.combo svg { width: 12px; height: 12px; color: var(--s-text2); }
.tog { display: flex; align-items: center; gap: 12px; font-size: 14px; }
.sw { width: 40px; height: 20px; border-radius: 10px; position: relative; }
.sw.on { background: var(--s-accent); }
.sw.on::after { content: ""; position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--s-on-accent); top: 4px; right: 4px; }
.sw.off { box-shadow: inset 0 0 0 1px var(--s-off-stroke); }
.sw.off::after { content: ""; position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--s-off-knob); top: 4px; left: 4px; }
.sw.dis { opacity: .4; }
.s-grid { display: flex; flex-direction: column; gap: 8px; }
.s-w { background: var(--s-card); border-radius: 8px; box-shadow: inset 0 0 0 1px var(--s-stroke); padding: 12px 16px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.s-w .top { color: var(--s-caption); font-size: 12px; }
.s-w .hero { font-size: 28px; line-height: 34px; color: var(--s-text); margin-top: 4px; }
.s-w .hero .u { font-size: 16px; color: var(--s-text2); }
.s-w .pairv .hero { margin: 0; }
.s-w .ctx { font-size: 12px; color: var(--s-caption); }
.s-w .meter { background: var(--s-track); }
.s-w .meter i { background: var(--s-accent); }
.s-drives { display: grid; grid-template-columns: 1fr 1fr; }
.s-drive { padding: 12px 16px; border-top: 1px solid var(--s-divider); }
.s-drive:nth-child(-n+2) { border-top: 0; }
.s-drive:nth-child(even) { box-shadow: inset 1px 0 0 var(--s-divider); }
.s-drives.one { grid-template-columns: 1fr; }
.s-drives.one .s-drive:nth-child(2) { border-top: 1px solid var(--s-divider); box-shadow: none; }
.s-drive .l { display: flex; align-items: baseline; }
.s-drive .l span:last-child { margin-left: auto; font-size: 12px; color: var(--s-caption); font-variant-numeric: tabular-nums; }
.s-drive .meter { margin-top: 8px; height: 4px; background: var(--s-track); }
.s-drive .meter i { background: var(--s-accent); }
.chev { width: 12px; height: 12px; color: var(--s-text2); }

/* ---------- Review page ---------- */
.bar { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 16px 24px; color: #ddd; font-size: 13px; }
.bar b { font-weight: 600; margin-right: 6px; }
.seg { display: inline-flex; background: rgba(255,255,255,.06); border-radius: 6px; padding: 2px; }
.seg button { padding: 4px 10px; border-radius: 4px; color: #ccc; }
.seg button.on { background: rgba(255,255,255,.14); color: #fff; }
.sheet { display: grid; grid-template-columns: repeat(auto-fill, 568px); gap: 16px 16px; padding: 0 24px 24px; }
.sheet figure { margin: 0; }
.sheet figcaption { font-size: 12px; color: #aaa; padding: 6px 2px 0; }
.boardsheet { padding: 24px; display: grid; width: max-content; gap: 20px 16px; background: #101013; }
.boardsheet figcaption { font: 600 13px var(--font); color: #bbb; padding: 0 0 8px 2px; }
.boardsheet.light-sheet { background: #ECECEF; }
.boardsheet.light-sheet figcaption { color: #444; }
.boardsheet figure { margin: 0; }
</style>
</head>
<body>
<script>
// ---------- Glyphs (Lucide paths; GPU is authored in the same stroke) ----------
const P = {
  back: '<path d="m15 18-6-6 6-6"/>',
  down: '<path d="m6 9 6 6 6-6"/>',
  cpu: '<rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/>',
  gpu: '<path d="M2 6h17a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H6"/><path d="M2 4v16"/><circle cx="10.5" cy="12" r="3"/><path d="M17 10v4"/>',
  mem: '<path d="M6 19v-3M10 19v-3M14 19v-3M18 19v-3M8 11V9M16 11V9M12 11V9M2 15h20"/><path d="M2 7a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v1.1a2 2 0 0 0 0 3.837V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-5.1a2 2 0 0 0 0-3.837Z"/>',
  net: '<rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3M12 12V8"/>',
  drive: '<path d="M22 12H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><path d="M6 16h.01M10 16h.01"/>',
  battery: '<rect width="16" height="10" x="2" y="7" rx="2" ry="2"/><path d="M22 11v2M6 11v2M10 11v2M14 11v2"/>',
  temp: '<path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>',
  dn: '<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',
  up: '<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
};
const icon = (k, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24">${P[k]}</svg>`;
const arrow = (k) => `<svg class="i arrow" viewBox="0 0 24 24">${P[k]}</svg>`;
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

// ---------- Fake but realistic data ----------
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function series(seed, n, base, swing, lo, hi, spikes = 0) {
  const r = rng(seed), out = []; let v = base, drift = 0;
  for (let i = 0; i < n; i++) {
    drift = drift * .82 + (r() - .5) * swing;
    v += drift + (base - v) * .06;
    let x = v;
    if (spikes && r() < spikes) x += swing * (2 + r() * 3);
    out.push(Math.max(lo, Math.min(hi, x)));
  }
  return out;
}
// Every graph holds the last 120 readings: the sampler keeps them for each reading the overview shows, all the time.
const HIST = 120;
// Network history is in KiB/s.
// This PC, as the 2026-11-01 renders read it: idle loads, Ethernet, 6 drives.
const yourpc = {
  key: 'yourpc', label: 'Your PC',
  cpu: { load: 4, clock: '4.62 GHz', name: 'AMD Ryzen 9 9950X3D 16-Core Processor', logical: 32, up: '9 d 3 h',
    hist: series(21, HIST, 4, 1.1, 1, 100, .05),
    cores: [6, 2, 9, 1, 4, 0, 3, 1, 12, 2, 5, 1, 3, 0, 2, 1, 8, 3, 1, 0, 2, 1, 4, 0, 1, 2, 0, 1, 3, 0, 1, 0],
    apps: [['Claude', '1.5%', '#D97757'], ['Desktop Window Manager', '0.7%', '#0078D4'], ['Chippi', '0.4%', '#8F5CFF']] },
  gpus: [{ id: 'rtx', name: 'NVIDIA GeForce RTX 4080', short: 'GeForce RTX 4080', load: 1, temp: '50 °C', used: 2.1, total: 15.7, fan: '0%', shared: '116 MiB',
    hist: series(22, HIST, 1.2, .6, 0, 100, .04), apps: [['Claude', '0.2%', '#D97757'], ['Desktop Window Manager', '0.2%', '#0078D4'], ['Chippi', '0.1%', '#8F5CFF']] },
    { id: 'igpu', name: 'AMD Radeon(TM) Graphics', short: 'Radeon Graphics', load: 0 }],
  mem: { pct: 42, used: '25.9', total: '61.7', avail: '35.8 GiB', commit: 41.4, limit: 65.6, hist: series(23, HIST, 42, .35, 0, 100),
    apps: [['Claude', '2.3 GiB', '#D97757'], ['Google Chrome', '1.4 GiB', '#4C8BF5'], ['.NET Host', '1.2 GiB', '#512BD4']] },
  net: { adapters: [{ name: 'Ethernet', on: true, down: ['2', 'KiB/s'], up: ['1', 'KiB/s'] }],
    down: series(24, HIST, 3, 3, 0, 1e6, .08), up: series(25, HIST, 2, 2.5, 0, 1e6, .1) },
  drives: [{ k: 'C:', free: ['704', 'GiB'], total: '930 GiB', used: 226 / 930 }, { k: 'D:', free: ['477', 'GiB'], total: '477 GiB', used: 0 },

// ---------- Scales ----------
// CPU and GPU loads fit their history: 10, 25, 50 or 100%. Rates double from 64 KiB/s. Temperatures go by 25 °C.
// Memory and Battery are levels, so they stay at 100%: a fitted scale would draw 42% as nearly full.
const fitPct = (vs) => [10, 25, 50, 100].find(s => s >= Math.max(...vs)) ?? 100;
const fitRate = (...all) => { const top = Math.max(...all.flat()); let s = 64; while (s < top) s *= 2; return s; };
const rateLabel = (s) => s >= 1024 ? `${s / 1024} MiB/s` : `${s} KiB/s`;
const fitTemp = (vs) => Math.max(25, Math.ceil(Math.max(...vs) / 25) * 25);
const scales = (d) => ({
  cpu: fitPct(d.cpu.hist), gpu: d.gpus[0] && fitPct(d.gpus[0].hist), mem: 100,
  net: fitRate(d.net.down, d.net.up), temp: d.zones && fitTemp(d.zoneHist),
});

// ---------- Graphs ----------
let gid = 0;
function graph(values, max, { w, h, second = null, scale = null, caution = false, color = 'var(--accent)', color2 = 'var(--text2)', cls = 'graph', mid = false, base = false, fadeIn = false } = {}) {
  const id = 'g' + (++gid), step = w / (values.length - 1);
  const y = (v) => (h - 1) - Math.min(v / max, 1) * (h - 2);
  const line = (vs) => vs.map((v, i) => `${i ? 'L' : 'M'}${(i * step).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const stroke = caution ? 'var(--caution)' : color;
  // fadeIn: a graph that starts inside its card lets its oldest readings fade in over 40 px.
  return `<svg class="${cls}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${stroke}" stop-opacity="${caution ? '.16' : '.30'}"/><stop offset="1" stop-color="${stroke}" stop-opacity=".02"/></linearGradient>
    ${fadeIn ? `<linearGradient id="${id}m"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="${(40 / w).toFixed(3)}" stop-color="#fff"/></linearGradient><mask id="${id}k"><rect width="${w}" height="${h}" fill="url(#${id}m)"/></mask>` : ''}</defs>
    <g${fadeIn ? ` mask="url(#${id}k)"` : ''}>
      ${mid ? `<path d="M0,${h / 2}H${w}" stroke="var(--hair)" stroke-dasharray="2 3"/>` : ''}
      ${base ? `<path d="M0,${h - .5}H${w}" stroke="var(--hair)"/>` : ''}
      <path d="${line(values)}L${w},${h}L0,${h}Z" fill="url(#${id})"/>
      <path d="${line(values)}" fill="none" stroke="${stroke}" stroke-width="1.5" stroke-linejoin="round"/>
      ${second ? `<path d="${line(second)}" fill="none" stroke="${color2}" stroke-width="1.25" stroke-dasharray="3 3"/>` : ''}
    </g>
    ${scale ? `<text class="scale" x="${w - 11}" y="10" text-anchor="end">${scale}</text>` : ''}
  </svg>`;
}

// ---------- Overview widgets ----------
const pct = (v) => `<span class="num">${v}</span><span class="u">%</span>`;
const amount = ([n, u]) => `<span class="num">${n}</span><span class="u sp">${u}</span>`;
const deg = (v) => `<span class="num">${v}</span><span class="u sp">°C</span>`;
const meter = (f, caution) => `<div class="meter${caution ? ' caution' : ''}"><i style="width:${Math.round(f * 1000) / 10}%"></i></div>`;
// A widget's graph starts under its context line: 10 padding, the 16 top line, 4, the 30 value and the 16 context line.
const GRAPH_TOP = 76;
function widget({ go, glyph, name, fact = '', hero, ctx = '', m = null, g = null, caution = false, w, h, body }) {
  return `<button class="w${caution ? ' caution' : ''}" data-go="${go}" style="width:${w}px;height:${h}px" aria-label="${esc(name)}">
    <div class="top">${icon(glyph)}<span class="name">${name}</span>${fact ? `<span class="fact">${esc(fact)}</span>` : ''}</div>
    ${body ?? `<div class="hero">${hero}</div>${ctx ? `<div class="ctx">${ctx}</div>` : ''}${m === null ? '' : meter(m, caution)}`}
    ${g ? graph(g.values, g.max, { w: w - 2, h: h - GRAPH_TOP - 1, second: g.second, caution, cls: 'spark' }) : ''}
  </button>`;
}
function loadItems(d) {
  const gpu = d.gpus[0], s = scales(d);
  return [
    { go: 'cpu', glyph: 'cpu', name: 'CPU', hero: pct(d.cpu.load), ctx: d.cpu.clock, g: { values: d.cpu.hist, max: s.cpu } },
    gpu && { go: 'gpu', glyph: 'gpu', name: 'GPU', fact: gpu.temp ?? '', hero: pct(gpu.load), ctx: esc(gpu.short), g: { values: gpu.hist, max: s.gpu } },
    { go: 'memory', glyph: 'mem', name: 'Memory', hero: pct(d.mem.pct), ctx: `${d.mem.used} of ${d.mem.total} GiB`, g: { values: d.mem.hist, max: s.mem }, caution: d.alerts?.mem },
  ].filter(Boolean);
}
function netWidget(d, w, h) {
  const a = d.net.adapters.find(x => x.on), max = scales(d).net;
  if (w > 300) {
    // Alone in its row: the two rates on the left, their graph across the rest under the top line, its oldest readings fading in.
    return `<button class="w" data-go="network" style="width:${w}px;height:${h}px" aria-label="Network">
      <div class="top">${icon('net')}<span class="name">Network</span><span class="fact">${esc(a.name)}</span></div>
      <div class="pairv"><div class="hero">${arrow('dn')}${amount(a.down)}</div><div class="hero">${arrow('up')}${amount(a.up)}</div></div>
      ${graph(d.net.down, max, { w: w - 245, h: h - 31, second: d.net.up, cls: 'spark side', fadeIn: true })}
    </button>`;
  }
  return widget({ go: 'network', glyph: 'net', name: 'Network', fact: a.name, w, h, hero: arrow('dn') + amount(a.down),
    ctx: `${arrow('up')}<span class="num">${a.up.join(' ')}</span>`, g: { values: d.net.down, second: d.net.up, max } });
}
// Drives keep their meters: free space changes by the hour, so a graph of 4 minutes would be a flat line.
function pickDrives(d, cells) {
  const alerting = new Set(d.alerts?.drives ?? []);
  if (d.drives.length <= cells) return { shown: d.drives, more: 0, alerting };
  // The fullest (and any alerting) first, shown in letter order; the rest fold into "+N more".
  const keep = [...d.drives].sort((a, b) => (alerting.has(b.k) - alerting.has(a.k)) || b.used - a.used).slice(0, cells - 1);
  return { shown: d.drives.filter(x => keep.includes(x)), more: d.drives.length - keep.length, alerting };
}
const DRIVE_ROW = 20;
const drivesHeight = (rows) => 10 + 16 + 4 + rows * DRIVE_ROW + 10;
function drivesWidget(d, w, rows) {
  const solo = d.drives.length === 1;
  const { shown, more, alerting } = pickDrives(d, rows * 2);
  const cells = shown.map(x => `<div class="dr${alerting.has(x.k) ? ' caution' : ''}" title="${x.k} ${x.free.join(' ')} free of ${x.total}"><span class="k">${x.k}</span>${meter(x.used, alerting.has(x.k))}<span class="t"><b>${x.free.join(' ')}</b> free${solo ? ` of ${x.total}` : ''}</span></div>`).join('')
    + (more ? `<div class="dr more">+${more} more</div>` : '');
  return widget({ go: 'drives', glyph: 'drive', name: 'Drives', fact: solo ? '' : `${d.drives.length} drives`, w, h: drivesHeight(rows),
    body: `<div class="drows${solo ? ' one' : ''}">${cells}</div>` });
}
function overview(d) {
  const loads = loadItems(d);
  const others = [d.net && 'net', d.battery && 'battery', d.zones && 'temp'].filter(Boolean);
  const wideNet = others.length === 1 && others[0] === 'net';
  const rowCount = (loads.length ? 1 : 0) + (others.length ? 1 : 0) + (d.drives.length ? 1 : 0);
  const free = 304 - 8 * (rowCount - 1) - (wideNet ? 72 : 0);
  const graphRows = (loads.length ? 1 : 0) + (others.length && !wideNet ? 1 : 0);
  // Drives take up to 3 rows, giving one up while a graph row would be under 104.
  let rows = Math.min(3, Math.ceil(d.drives.length / 2));
  while (rows > 1 && (free - drivesHeight(rows)) / graphRows < 104) rows--;
  const gh = Math.floor((free - drivesHeight(rows)) / graphRows);
  const lw = (496 - 8 * (loads.length - 1)) / loads.length;
  const s = scales(d);
  let html = `<div class="row">${loads.map(i => widget({ ...i, w: lw, h: gh })).join('')}</div>`;
  if (wideNet) html += netWidget(d, 496, 72);
  else if (others.length) {
    const ow = (496 - 8 * (others.length - 1)) / others.length;
    html += `<div class="row">${others.map(k => k === 'net' ? netWidget(d, ow, gh)
      : k === 'battery' ? widget({ go: 'battery', glyph: 'battery', name: 'Battery', hero: pct(d.battery.pct), ctx: `${d.battery.state} · ${d.battery.left.replace(' left', '')}`, m: d.battery.pct / 100, w: ow, h: gh })
      : widget({ go: 'temperature', glyph: 'temp', name: 'Temperature', hero: deg(Math.max(...d.zones)), ctx: `Hottest of ${d.zones.length} zones`, g: { values: d.zoneHist, max: s.temp }, w: ow, h: gh })).join('')}</div>`;
  }
  return html + drivesWidget(d, 496, rows);
}

// ---------- Detail pages ----------
// The top card: the value with the second reading over the graph's scale at the right (where the line
// can't run over it), then the graph out to the card's sides (and bottom when nothing sits under it).
function gcard({ h, hero, side = '', heroCaution = false, values, max, scale, second = null, caution = false, foot = '' }) {
  const gh = h - 46 - (foot ? 36 : 1);
  return `<div class="card gcard" style="height:${h}px;flex:none">
    <div class="hrow${heroCaution ? ' caution' : ''}"><div class="hero">${hero}</div><span class="side">${side ? `<span>${side}</span>` : ''}<span class="sc">${scale}</span></span></div>
    ${graph(values, max, { w: 494, h: gh, second, caution, mid: true, base: !!foot })}
    ${foot ? `<div class="gfoot">${foot}</div>` : ''}</div>`;
}
const appRows = (apps) => apps.map(([n, v, c]) => `<div class="r"><span class="tile" style="background:${c}">${n.replace(/[^\p{L}\p{Nd} ]/gu, '').split(' ').map(s => s[0]).join('').slice(0, 2)}</span><span class="nm">${esc(n)}</span><span class="v">${v}</span></div>`).join('');
const factRows = (facts) => facts.map(([k, v]) => `<div class="r"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
// Top apps beside the facts, their rows level across the two cards. 10 + 16 label + 2 + 3 rows of 28 + 10.
const PAIR = 122;
const pair = (apps, facts) => `<div class="row" style="height:${PAIR}px;flex:none">
  <div class="card" style="width:244px"><div class="lbl"><span>Top apps</span></div><div class="rows">${appRows(apps)}</div></div>
  <div class="card" style="width:244px"><div class="lbl"></div><div class="rows">${factRows(facts)}</div></div></div>`;
const TOP = 304 - 8 - PAIR;

const DETAIL = {
  cpu: (d) => { const s = scales(d).cpu; return { title: 'CPU', html: gcard({ h: TOP, hero: pct(d.cpu.load), side: d.cpu.clock, values: d.cpu.hist, max: s, scale: `${s}%`,
      foot: `<div class="strip" title="${d.cpu.logical} logical processors">${d.cpu.cores.map(v => `<i><b style="height:${Math.min(100, v / s * 100)}%"></b></i>`).join('')}</div>` })
      + pair(d.cpu.apps, [['Processor', `<span style="font-weight:400" title="${d.cpu.name}">${d.cpu.name.replace(/ \d+-Core Processor/, '')}</span>`], ['Logical processors', d.cpu.logical], ['Up time', d.cpu.up]]) }; },
  gpu: (d) => { const g = d.gpus[0], s = scales(d).gpu; return { title: 'GPU', pick: d.gpus.length > 1 ? g.short : null, html: gcard({ h: TOP, hero: pct(g.load), side: g.temp ?? '', values: g.hist, max: s, scale: `${s}%`,
      foot: g.used != null ? `<div class="mline"><div class="l"><span>Dedicated memory</span><span>${g.used} of ${g.total.toFixed(1)} GiB</span></div>${meter(g.used / g.total)}</div>` : `<div class="mline"><div class="l"><span>Shared memory</span><span>${g.shared}</span></div>${meter(.15)}</div>` })
      + pair(g.apps, [['Fan', g.fan ?? '—'], ['Shared memory', g.shared]].filter(x => x[1] !== '—')) }; },
  memory: (d) => { const s = scales(d).mem; return { title: 'Memory', html: gcard({ h: TOP, hero: pct(d.mem.pct), heroCaution: d.alerts?.mem, side: `${d.mem.used} of ${d.mem.total} GiB`, values: d.mem.hist, max: s, scale: `${s}%`, caution: d.alerts?.mem,
      foot: `<div class="mline"><div class="l"><span>Committed</span><span>${d.mem.commit.toFixed(1)} of ${d.mem.limit.toFixed(1)} GiB</span></div>${meter(d.mem.commit / d.mem.limit)}</div>` })
      + pair(d.mem.apps, [['Available', d.mem.avail], ['Installed', `${d.mem.total} GiB`]]) }; },
  network: (d) => {
    const a = d.net.adapters.find(x => x.on), s = scales(d).net, many = d.net.adapters.length > 1;
    // One adapter: the legend names it and the graph takes the page. More: a row each, 30 tall.
    const list = many ? 10 + 16 + 2 + d.net.adapters.length * 30 + 10 : 0;
    return { title: 'Network', html: gcard({ h: 304 - (many ? list + 8 : 0), hero: `${arrow('dn')}${amount(a.down)}</div><div class="hero" style="margin-left:24px">${arrow('up')}${amount(a.up)}`,
      values: d.net.down, second: d.net.up, max: s, scale: rateLabel(s),
      foot: `<div class="legend"><span><i class="sw"></i>Receive</span><span><i class="sw dash"></i>Send</span><span class="r">${esc(a.name)}</span></div>` })
      + (many ? `<div class="card" style="height:${list}px;flex:none"><div class="lbl"><span>Adapters</span></div><div class="rows">
      ${d.net.adapters.map(x => `<button class="adapter${x.on ? ' on' : ''}"><span class="nm">${esc(x.name)}</span>${x.on ? `<span class="rate">${icon('dn')}${x.down.join(' ')}</span><span class="rate">${icon('up')}${x.up.join(' ')}</span>` : `<span class="off">Not connected</span>`}</button>`).join('')}
      </div></div>` : '') };
  },
  drives: (d) => {
    // Activity for up to 4 disks; Space above it, two drives a row, as many rows of 36 as fit, the same drives the overview keeps.
    // Both cards take the height their rows need, from the top: the list grows with the drives.
    const disks = d.disks.slice(0, 4), activity = 10 + 16 + 2 + disks.length * 28 + 10;
    const solo = d.drives.length === 1, perRow = solo ? 1 : 2;
    const rows = Math.floor((304 - 8 - activity - 10 - 16 - 2 - 10) / 36);
    const { shown, alerting } = pickDrives(d, rows * perRow);
    const more = d.drives.length - shown.length;
    const space = 10 + 16 + 2 + Math.ceil(shown.length / perRow) * 36 + 10;
    return { title: 'Drives', html: `<div class="card" style="height:${space}px;flex:none">
      <div class="lbl"><span>Space</span>${more ? `<span>+${more} more in Settings</span>` : ''}</div>
      <div class="vols${solo ? ' one' : ''}">${shown.map(x => `<div class="vol${alerting.has(x.k) ? ' caution' : ''}"><div class="l"><span class="k">${x.k}</span><span class="t"><b>${x.free.join(' ')}</b> free of ${x.total}</span></div>${meter(x.used, alerting.has(x.k))}</div>`).join('')}</div></div>
      <div class="card" style="height:${activity}px;flex:none"><div class="lbl"><span>Activity</span><span>Read · Write</span></div><div class="rows">
      ${disks.map(([n, l, act, r, w]) => `<div class="r"><span class="nm">${n} <span style="color:var(--text3)">· ${l}</span></span><span class="v reg" style="margin-left:auto;width:70px;text-align:right">${act} active</span><span class="v reg num" style="margin-left:0;width:150px;text-align:right">${r} · ${w}</span></div>`).join('')}
      </div></div>` };
  },
  battery: (d) => {
    // Time left is the top card's reading, so the facts don't repeat it. 10 + 2 rows of 28 + 10.
    const facts = 10 + 2 * 28 + 10;
    return { title: 'Battery', html: gcard({ h: 304 - 8 - facts, hero: pct(d.battery.pct), side: d.battery.left, values: d.battery.hist, max: 100, scale: '100%' })
      + `<div class="card" style="height:${facts}px;flex:none"><div class="rows" style="margin-top:0">${factRows([['State', d.battery.state], ['Rate', d.battery.rate]])}</div></div>` };
  },
  temperature: (d) => {
    // Zone tiles share the width, 4 to a row, up to 8.
    const n = Math.min(d.zones.length, 8), across = Math.min(n, 4), tileRows = Math.ceil(n / 4);
    const card = 10 + 16 + 2 + tileRows * 44 + (tileRows - 1) * 8 + 10, s = scales(d).temp;
    return { title: 'Temperature', html: gcard({ h: 304 - 8 - card, hero: deg(Math.max(...d.zones)), side: `Hottest of ${d.zones.length} zones`, values: d.zoneHist, max: s, scale: `${s} °C` })
      + `<div class="card" style="height:${card}px;flex:none"><div class="lbl"><span>Thermal zones</span></div><div class="zones" style="grid-template-columns:repeat(${across},1fr)">${d.zones.slice(0, 8).map((z, i) => `<div class="zone"><div class="k">Zone ${i + 1}</div><div class="v">${z} °C</div></div>`).join('')}</div></div>` };
  },
};

function island(d, screen, opts = {}) {
  const page = screen === 'overview' ? { title: 'System', html: overview(d) } : DETAIL[screen](d);
  return `<div class="stage ${opts.theme}"><div class="panel" data-screen="${screen}">
    <div class="head"><button class="back" aria-label="Back">${icon('back')}</button><span class="title">${page.title}</span>
      ${page.pick ? `<button class="pick"><span>${esc(page.pick)}</span>${icon('down')}</button>` : ''}</div>
    <div class="body"><div class="page${opts.enter ? ' enter' + (opts.enter === 'back' ? ' from-left' : '') : ''}">${page.html}</div></div>
  </div></div>`;
}

// ---------- Settings › System ----------
// The island's widgets in the island's rows: loads, then Network, Battery and Temperature; graphs in the Windows accent.
const S_GRAPH_TOP = 12 + 16 + 4 + 34 + 16, S_H = 126;
function sWidget(x, w, h = S_H) {
  const g = x.g ? graph(x.g.values, x.g.max, { w: w - 2, h: h - S_GRAPH_TOP - 1, second: x.g.second, color: 'var(--s-accent)', color2: 'var(--s-text2)', cls: 'spark' }) : '';
  return `<div class="s-w" style="width:${w}px;height:${h}px"><div class="top">${icon(x.glyph)}<span class="name">${x.name}</span>${x.fact ? `<span class="fact">${esc(x.fact)}</span>` : ''}</div>
    <div class="hero">${x.hero}</div><div class="ctx">${x.ctx}</div>${x.m != null ? meter(x.m) : ''}${g}</div>`;
}
function settings(d, theme) {
  const gpu = d.gpus[0], a = d.net.adapters.find(x => x.on), s = scales(d);
  const sw = (on, dis) => `<span class="sw ${on ? 'on' : 'off'}${dis ? ' dis' : ''}"></span>`;
  const combo = (v) => `<div class="combo"><span>${esc(v)}</span>${icon('down')}</div>`;
  const W = 760;
  const loads = loadItems(d);
  const lw = (W - 8 * (loads.length - 1)) / loads.length;
  const net = { glyph: 'net', name: 'Network', fact: a.name, hero: arrow('dn') + amount(a.down), ctx: `${arrow('up')}${a.up.join(' ')}`, g: { values: d.net.down, second: d.net.up, max: s.net } };
  const others = [net,
    d.battery && { glyph: 'battery', name: 'Battery', hero: pct(d.battery.pct), ctx: d.battery.left, m: d.battery.pct / 100 },
    d.zones && { glyph: 'temp', name: 'Temperature', hero: deg(Math.max(...d.zones)), ctx: `Hottest of ${d.zones.length} zones`, g: { values: d.zoneHist, max: s.temp } }].filter(Boolean);
  const ow = (W - 8 * (others.length - 1)) / others.length;
  const othersRow = others.length === 1
    ? `<div class="s-w" style="width:${W}px;height:92px"><div class="top">${icon('net')}<span class="name">Network</span><span class="fact">${esc(a.name)}</span></div>
        <div class="pairv"><div class="hero">${arrow('dn')}${amount(a.down)}</div><div class="hero">${arrow('up')}${amount(a.up)}</div></div>
        ${graph(d.net.down, s.net, { w: W - 345, h: 92 - 35, second: d.net.up, color: 'var(--s-accent)', color2: 'var(--s-text2)', cls: 'spark side', fadeIn: true })}</div>`
    : `<div class="row">${others.map(x => sWidget(x, ow)).join('')}</div>`;
  const readings = ['CPU', gpu && 'GPU', 'Memory', 'Network', 'Drives', d.battery && 'Battery', d.zones && 'Temperature'].filter(Boolean);
  return `<div class="settings ${theme}">
    <h1 class="s-title">System</h1>
    <div class="s-grid"><div class="row">${loads.map(x => sWidget(x, lw)).join('')}</div>${othersRow}</div>
    <div class="s-sec">Drives</div>
    <div class="s-card s-drives${d.drives.length === 1 ? ' one' : ''}">${d.drives.map(x => `<div class="s-drive"><div class="l"><span>${x.k}</span><span>${x.free.join(' ')} free of ${x.total}</span></div>${meter(x.used)}</div>`).join('')}</div>
    ${d.zones ? `<div class="s-sec">Thermal zones</div><div class="s-card">${d.zones.map((z, i) => `<div class="s-row"><span class="lab">Zone ${i + 1}</span><span>${z} °C</span></div>`).join('')}</div>` : ''}
    <div class="s-sec">General</div>
    <div class="s-card">
      <div class="s-row"><span class="lab">Update speed</span>${combo('2 seconds')}</div>
      <div class="s-row"><span class="lab">Home status</span>${combo('CPU')}</div>
      ${d.gpus.length > 1 ? `<div class="s-row"><span class="lab">GPU</span>${combo(gpu.name)}</div>` : ''}
      ${d.net.adapters.length > 1 ? `<div class="s-row"><span class="lab">Network adapter</span>${combo(a.name)}</div>` : ''}
    </div>
    <div class="s-sec">Readings</div>
    <div class="s-card">${readings.map(r => `<div class="s-row"><span class="lab">${r}</span><span class="tog">On ${sw(true)}</span></div>`).join('')}</div>
    <div class="s-sec">Units</div>
    <div class="s-card"><div class="s-row"><span class="lab">Temperature</span>${combo('Celsius')}</div><div class="s-row"><span class="lab">Network speed</span>${combo('Bytes per second')}</div></div>
    <div class="s-sec">Alerts</div>
    <div class="s-card">
      <div class="s-row"><span class="lab">CPU load</span><span>90%</span><span class="tog">Off ${sw(false)}</span>${icon('down', 'i chev')}</div>
      <div class="s-row"><span class="lab">Memory in use</span><span>90%</span><span class="tog">Off ${sw(false)}</span>${icon('down', 'i chev')}</div>
      <div class="s-row"><span class="lab">Low disk space</span><span>10% free</span><span class="tog">Off ${sw(false)}</span>${icon('down', 'i chev')}</div>
      ${d.battery ? `<div class="s-row"><span class="lab">Low battery</span><span>15%</span><span class="tog">Off ${sw(false)}</span>${icon('down', 'i chev')}</div>` : ''}
      ${gpu?.temp ? `<div class="s-row"><span class="lab">GPU temperature</span><span class="cap">Set a limit</span><span class="tog" style="opacity:.55">Off ${sw(false)}</span>${icon('down', 'i chev')}</div>` : ''}
      <div class="s-row"><span class="lab">Repeat interval</span>${combo('15 minutes')}</div>
    </div>
  </div>`;
}

// ---------- Boards (render.ps1) and the review page ----------
const q = new URLSearchParams(location.search);
const board = q.get('board');
function finish(el) { const r = el.getBoundingClientRect(); document.body.setAttribute('data-size', `${Math.ceil(r.width)},${Math.ceil(r.height)}`); }
const SCREENS = ['overview', 'cpu', 'gpu', 'memory', 'network', 'drives'];
function sheet(theme, items) {
  return `<div class="boardsheet ${theme === 'light' ? 'light-sheet' : ''}" style="grid-template-columns:repeat(3,568px)">${items.map(([cap, d, s]) => `<figure><figcaption>${cap}</figcaption>${island(d, s, { theme })}</figure>`).join('')}</div>`;
}
const BOARDS = {
  overviews: [['Your PC · idle, Ethernet, 6 drives', yourpc, 'overview'], ['Busy desktop · 2 GPUs, 4 drives', desktop, 'overview'], ['Laptop · battery, 3 thermal zones', laptop, 'overview'],
    ['Alerts · Memory in use and Low disk on', alert, 'overview'], ['No GPU · 8 drives', crowded, 'overview'], ['Busy desktop · Network with 2 adapters', desktop, 'network']],
  details: [['CPU', yourpc, 'cpu'], ['GPU · picker for 2 GPUs', yourpc, 'gpu'], ['Memory', yourpc, 'memory'], ['Network · one adapter', yourpc, 'network'], ['Drives', yourpc, 'drives'], ['Busy desktop · CPU', desktop, 'cpu']],
  more: [['Laptop · Battery', laptop, 'battery'], ['Laptop · Temperature', laptop, 'temperature'], ['Laptop · Drives', laptop, 'drives'],
    ['Busy desktop · GPU', desktop, 'gpu'], ['No GPU · Drives', crowded, 'drives'], ['Alerts · Memory', alert, 'memory']],
};
if (board) {
  const theme = q.get('theme') || 'dark';
  let html;
  if (BOARDS[board]) html = sheet(theme, BOARDS[board]);
  else if (board === 'settings') html = settings(MACHINES[q.get('machine') || 'yourpc'], theme);
  else html = island(MACHINES[q.get('machine') || 'yourpc'], board, { theme });
  document.body.innerHTML = html;
  document.body.style.overflow = 'hidden'; // the panels' shadows would otherwise add scrollbars to the shot
  finish(document.body.firstElementChild);
} else {
  document.body.className = 'review';
  const state = { theme: 'dark', machine: 'yourpc', screen: 'overview' };
  const root = document.createElement('div');
  document.body.appendChild(root);
  const seg = (name, opts) => `<span><b>${name}</b><span class="seg">${opts.map(([k, l]) => `<button data-set="${name}" data-val="${k}" class="${state[name] === k ? 'on' : ''}">${l}</button>`).join('')}</span></span>`;
  function render(enter) {
    const d = MACHINES[state.machine];
    if (!d.gpus.length && state.screen === 'gpu' || !d.battery && state.screen === 'battery' || !d.zones && state.screen === 'temperature') state.screen = 'overview';
    root.innerHTML = `<div class="bar">${seg('theme', [['dark', 'Dark'], ['light', 'Light']])}${seg('machine', Object.values(MACHINES).map(m => [m.key, m.label]))}
      <span style="color:#999">Click a widget to open its page; Back or Esc returns.</span></div>
      <div style="padding:0 24px 8px">${island(d, state.screen, { theme: state.theme, enter })}</div>
      <div class="bar"><b>Every screen</b></div>
      <div class="sheet">${[...SCREENS.filter(s => s !== 'gpu' || d.gpus.length), ...(d.battery ? ['battery', 'temperature'] : [])].map(s => `<figure>${island(d, s, { theme: state.theme })}<figcaption>${s === 'overview' ? 'System' : DETAIL[s](d).title}</figcaption></figure>`).join('')}</div>
      <div class="bar"><b>Settings › System</b></div>
      <div style="padding:0 24px 24px">${settings(d, state.theme)}</div>`;
  }
  root.addEventListener('click', (e) => {
    const set = e.target.closest('[data-set]');
    if (set) { state[set.dataset.set] = set.dataset.val; render(); return; }
    const live = root.querySelector('.panel');
    if (!live || !live.contains(e.target)) return;
    const go = e.target.closest('[data-go]');
    if (go) { state.screen = go.dataset.go; render('in'); return; }
    if (e.target.closest('.back') && state.screen !== 'overview') { state.screen = 'overview'; render('back'); }
  });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.screen !== 'overview') { state.screen = 'overview'; render('back'); } });
  render();
}
</script>
</body>
</html>
