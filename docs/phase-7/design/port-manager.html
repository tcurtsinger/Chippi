<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chippi Phase 7: Port manager mockups</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;margin:0}
svg.g{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}

/* tokens: Chippi.UI/Themes Dark.xaml / Light.xaml, as in wave-1.html */
.dark{--fill:rgba(40,40,44,.961);--bord:rgba(255,255,255,.09);--hair:rgba(255,255,255,.078);--face:rgba(255,255,255,.024);--faceh:rgba(255,255,255,.10);--cardb:rgba(255,255,255,.059);
 --btn:rgba(255,255,255,.071);--ctlb:rgba(255,255,255,.09);--hov:rgba(255,255,255,.059);--track:rgba(255,255,255,.16);
 --tx:#FFFFFF;--tx2:#C9C9C9;--tx3:#9A9A9A;--acc:#B79CFF;--accf:linear-gradient(135deg,#B78FFF,#82AEFF);--tint:rgba(183,156,255,.14);--onacc:#170F2E;--cau:#FCE100;--cautint:rgba(252,225,0,.10);--crit:#C42B1C;--ok:#6CCB5F;--oktint:rgba(108,203,95,.16);
 --shadow:0 16px 40px rgba(0,0,0,.5);--pop:#2C2C2F;
 --win:#202020;--surf:#2B2B2B;--sbord:rgba(255,255,255,.031);--div:rgba(255,255,255,.059);--st1:#FFFFFF;--st2:#C5C5C5;--st3:#ABABAB;--st4:#9D9D9D;--scau:#FCE100;
 --ssel:rgba(255,255,255,.059);--sbtn:rgba(255,255,255,.059);--sbtnb:rgba(255,255,255,.09);--sacc:#B79CFF;--sonacc:#000;--field:rgba(255,255,255,.059);--kcap:rgba(255,255,255,.09);--stint:rgba(183,156,255,.12)}
.light{--fill:rgba(245,245,246,.961);--bord:rgba(0,0,0,.078);--hair:rgba(0,0,0,.078);--face:rgba(255,255,255,.45);--faceh:#FFFFFF;--cardb:rgba(0,0,0,.059);
 --btn:rgba(255,255,255,.86);--ctlb:rgba(0,0,0,.09);--hov:rgba(0,0,0,.043);--track:rgba(0,0,0,.14);
 --tx:#1A1A1A;--tx2:#5C5C5C;--tx3:#707070;--acc:#7444F0;--accf:linear-gradient(135deg,#8F5CFF,#5B86FF);--tint:rgba(116,68,240,.10);--onacc:#FFFFFF;--cau:#9D5D00;--cautint:rgba(157,93,0,.10);--crit:#C42B1C;--ok:#0F7B0F;--oktint:rgba(15,123,15,.10);
 --shadow:0 16px 40px rgba(0,0,0,.2);--pop:#F9F9F9;
 --win:#F3F3F3;--surf:#FBFBFB;--sbord:rgba(0,0,0,.059);--div:rgba(0,0,0,.071);--st1:#1A1A1A;--st2:#404040;--st3:#5D5D5D;--st4:#616161;--scau:#9D5D00;
 --ssel:rgba(0,0,0,.055);--sbtn:#FFFFFF;--sbtnb:rgba(0,0,0,.10);--sacc:#6B4FBB;--sonacc:#FFF;--field:#FFFFFF;--kcap:rgba(0,0,0,.06);--stint:rgba(107,79,187,.10)}

.sheet{display:inline-flex;flex-direction:column;gap:28px;padding:32px;background:#161616;color:#E6E6E6}
.sheet.lt{background:#D9D9D9;color:#1A1A1A}
.srow{display:flex;gap:28px;align-items:flex-start}
.cap{font-size:13px;line-height:18px;font-weight:600;margin:0 0 8px;width:576px}
.cap small{display:none;font-weight:400;font-size:12px;opacity:.7}
.stage{background:#1F1F1F;padding:24px 32px 32px;border-radius:2px;width:576px}
.lt .stage{background:#C8CBD2}

/* island panel 520x360 */
.panel{position:relative;width:520px;height:360px;padding:12px;background:var(--fill);border:1px solid var(--bord);border-radius:8px;box-shadow:var(--shadow);color:var(--tx);font-size:12px;line-height:16px;overflow:hidden}
.hdr{display:flex;align-items:center;height:24px;margin-bottom:8px;gap:6px}
.hdr.s{height:32px}
.ib{width:28px;height:24px;display:inline-flex;align-items:center;justify-content:center;border:0;padding:0;border-radius:4px;background:transparent;color:var(--tx2);flex:none}
.ib.back{margin:0 0 0 -4px}
.ttl{flex:1;font-size:13px;font-weight:600;line-height:20px;white-space:nowrap}
.body{position:relative;width:494px;height:302px}
.ibtn{height:28px;padding:0 10px;border-radius:4px;border:1px solid var(--ctlb);background:var(--btn);font-size:12px;color:var(--tx);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-width:64px;justify-content:center;flex:none}
.ibtn.crit{background:#C42B1C;border-color:transparent;color:#fff;font-weight:600}
.ibtn.sm{height:24px;min-width:0;padding:0 8px;font-size:11px}
.ibtn.foc{outline:2px solid var(--tx);outline-offset:1px}
.t3{color:var(--tx3);font-size:11px}
.cau{color:var(--cau)}
.ok{color:var(--ok)}

/* Search (command bar): 32 field, 34 rows, 24 line, as DESIGN.md */
.sfield{flex:1;height:32px;border-radius:4px;border:1px solid var(--ctlb);border-bottom:2px solid var(--acc);background:var(--btn);display:flex;align-items:center;padding:0 10px;font-size:13px;gap:1px;white-space:pre}
.sfield .caret{width:1px;height:16px;background:var(--tx);margin-left:1px}
.isr{height:34px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:4px}
.isr.sel{background:var(--tint)}
.isr.dim{opacity:.6}
.isr .ld{width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--tx2);flex:none}
.isr .tx{flex:1;min-width:0}
.isr .nm{font-size:12px;line-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.isr .dt{font-size:11px;line-height:14px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.isr.sel .dt{color:var(--tx);opacity:.82}
.isr .dt.cau{color:var(--cau);opacity:1}
.adm{width:16px;display:flex;justify-content:center;flex:none}
.prow .ibtn.sm{min-width:44px}
.isr .vb{font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap;flex:none}
.sline{height:24px;display:flex;align-items:center;padding:0 10px;font-size:11px;color:var(--tx2)}
.plus{display:inline-block;margin-left:6px;height:16px;padding:0 5px;border-radius:4px;background:var(--btn);font-size:11px;font-weight:600;color:var(--tx2);line-height:16px;vertical-align:1px}

/* centered question / state (as the Cleaner's confirm) */
.q{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--fill);text-align:center;padding:0 24px}
.q .qt{font-size:16px;font-weight:600;line-height:22px}
.q .qd{font-size:11px;color:var(--tx3);margin-top:-6px}
.q .qb{display:flex;gap:8px;margin-top:4px}
.q .trk{width:180px;height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.q .trk i{display:block;height:100%;background:var(--accf);border-radius:2px}

/* process icons: a name-specific monogram where the real icon can't be read */
.mono{display:inline-flex;align-items:center;justify-content:center;border-radius:5px;color:#fff;font-weight:700;flex:none;font-family:'Segoe UI Variable Display','Segoe UI',sans-serif}
.mono.gen{background:var(--btn);color:var(--tx2);box-shadow:inset 0 0 0 1px var(--ctlb)}
.sw1 .mono.gen{background:var(--ssel);color:var(--st2);box-shadow:inset 0 0 0 1px var(--sbtnb)}

/* picker rows (App updates: 46) */
.prow{height:46px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:4px}
.prow.sel{background:var(--tint)}
.prow .tx{flex:1;min-width:0}
.prow .nm{font-size:12px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .dt{font-size:11px;line-height:15px;color:var(--tx2);white-space:nowrap}
.pfoot{position:absolute;left:0;right:0;bottom:0;height:28px;display:flex;align-items:center;gap:8px;color:var(--tx2);font-size:11px}
.pfoot .sp{flex:1}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--tx3);font-size:12px}

/* Settings (Chippi.UI general theme), as wave-1.html */
.sw1.nar{width:860px}
.rail{width:48px;flex:none;padding:6px 6px;display:flex;flex-direction:column;gap:2px;align-items:center;color:var(--st2)}
.rail .nv{position:relative;width:36px;height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center}
.rail .nv.sel{background:var(--ssel);color:var(--st1)}
.rail .nv.sel::before{content:"";position:absolute;left:-6px;top:8px;width:3px;height:16px;border-radius:2px;background:var(--sacc)}
.rail .hr{height:1px;width:28px;background:var(--div);margin:4px 0}
.nar .tr .tag{display:none}
.sw1{width:1120px;background:var(--win);color:var(--st1);font-size:14px;line-height:20px;border:1px solid rgba(128,128,128,.35);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.tbar{height:40px;display:flex;align-items:center;flex:none;font-size:12px}
.tbar .logo{width:16px;height:16px;border-radius:8px;background:linear-gradient(135deg,#B78FFF,#82AEFF);margin:0 9px 0 16px}
.tbar .tt{flex:1}
.tbar .cb{width:46px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--st2)}
.shell{display:flex;flex:1}
.side{width:272px;flex:none;padding:6px 12px 16px}
.find{height:32px;margin:0 0 8px;padding:0 10px;border-radius:4px;background:var(--field);border:1px solid var(--sbtnb);display:flex;align-items:center;gap:10px;font-size:14px;color:var(--st4)}
.gl{font-size:12px;color:var(--st2);padding:10px 12px 2px;line-height:16px}
.nav{position:relative;height:32px;margin:2px 4px;padding:0 12px;border-radius:4px;display:flex;align-items:center;gap:12px;white-space:nowrap;color:var(--st1)}
.nav.sel{background:var(--ssel);font-weight:600}
.nav.sel::before{content:"";position:absolute;left:-4px;top:8px;width:3px;height:16px;border-radius:2px;background:var(--sacc)}
.page{flex:1;padding:4px 40px 28px 40px;min-width:0}
.ptitle{font-family:'Segoe UI Variable Display','Segoe UI',sans-serif;font-size:20px;font-weight:600;line-height:28px;margin:0 0 8px}
.sh{font-size:14px;font-weight:600;line-height:20px;margin:16px 0 6px}
.scard{background:var(--surf);border:1px solid var(--sbord);border-radius:8px;margin-bottom:8px;position:relative}
.sr{min-height:48px;display:flex;align-items:center;padding:6px 16px;gap:12px;border-top:1px solid var(--div)}
.sr:first-child{border-top:0}
.sr .lead{width:20px;height:20px;color:var(--st1);flex:none;display:flex;align-items:center}
.sr .tl{flex:1;min-width:0}
.sr.grp{min-height:36px;padding-top:12px;padding-bottom:0;font-size:12px;color:var(--st3)}
.sbt{height:32px;padding:0 12px;border-radius:4px;border:1px solid var(--sbtnb);background:var(--sbtn);font-size:14px;color:var(--st1);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.sbt.sm{height:26px;padding:0 10px;font-size:12px;gap:6px}
.sbt.crit{background:#C42B1C;border-color:transparent;color:#fff;font-weight:600}
.sbt.foc{outline:2px solid var(--st1);outline-offset:1px}
.ssw{width:40px;height:20px;border-radius:10px;border:1px solid var(--st3);position:relative;flex:none}
.ssw::after{content:"";position:absolute;left:4px;top:4px;width:10px;height:10px;border-radius:5px;background:var(--st2)}
.ssw.on{background:var(--sacc);border-color:var(--sacc)}.ssw.on::after{left:auto;right:4px;width:12px;height:12px;top:3px;background:var(--sonacc)}
.kc{height:26px;min-width:26px;padding:0 8px;border-radius:4px;background:var(--kcap);border:1px solid var(--sbtnb);border-bottom-width:2px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--st1)}
.edit{color:var(--st1);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.path{color:var(--st3);font-size:14px;white-space:nowrap}
.keys{width:200px;display:flex;gap:4px;align-items:center;color:var(--st3);font-size:14px}
.sseg{display:inline-flex;height:32px;padding:3px;gap:2px;border-radius:6px;background:var(--ssel);font-size:13px;flex:none}
.sseg span{padding:0 12px;border-radius:4px;display:flex;align-items:center;color:var(--st2);white-space:nowrap}
.sseg span.on{background:var(--sbtn);color:var(--st1);font-weight:600;box-shadow:0 0 0 1px var(--sbtnb)}
.sfind{height:32px;width:220px;padding:0 10px;border-radius:4px;background:var(--field);border:1px solid var(--sbtnb);display:flex;align-items:center;gap:8px;font-size:13px;color:var(--st4);flex:none}
.sfind.on{color:var(--st1);border-bottom:2px solid var(--sacc)}
.tools{display:flex;align-items:center;gap:10px;margin:8px 0 10px}
.tools .sp{flex:1}
.tools .pz{display:flex;align-items:center;gap:8px;font-size:13px}

/* the live table */
.tbl{padding:2px 0 4px}
.tr{display:grid;grid-template-columns:var(--cols);align-items:center;column-gap:8px;height:34px;padding:0 8px 0 14px;font-size:12px;position:relative}
.tr.h{height:30px;font-size:11px;color:var(--st3);border-bottom:1px solid var(--div)}
.tr .c{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .pr{display:flex;align-items:center;gap:8px;min-width:0}
.tr .pr b{font-weight:400;white-space:nowrap;flex:none}
.tr .pr em{font-style:normal;color:var(--st3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tr .vbn{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--st2)}
.tr .mn{display:flex;justify-content:center;color:var(--st3)}
.tr.hov{background:var(--ssel);border-radius:4px}
.tr.hov .vbn{color:var(--st1);font-weight:600}
.tr.new{background:var(--stint)}
.tr.new::before{content:"";position:absolute;left:3px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--sacc)}
.tr.end{opacity:.42}
.tr.end .c,.tr.end .pr b{text-decoration:line-through;text-decoration-color:var(--st3)}
.tr.land{background:var(--stint);box-shadow:inset 0 0 0 1px var(--sacc);border-radius:4px}
.tr .mut{color:var(--st3)}
.strip{display:flex;align-items:center;gap:10px;height:46px;padding:0 10px 0 14px;font-size:13px;background:var(--stint);box-shadow:inset 0 0 0 1px var(--sacc);border-radius:4px;margin:2px 4px}
.strip.cauS{background:var(--cautint);box-shadow:inset 0 0 0 1px var(--scau)}
.strip.neuS{background:var(--ssel);box-shadow:inset 0 0 0 1px var(--sbtnb)}
.strip.neuS .m{color:var(--st2)}
.strip.okS{background:var(--oktint);box-shadow:inset 0 0 0 1px var(--ok)}
.strip .m{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .m small{font-size:12px;color:var(--st3);margin-left:8px}
.strip .trk{width:120px;height:4px;border-radius:2px;background:var(--div);overflow:hidden;flex:none}
.strip .trk i{display:block;height:100%;background:var(--sacc)}
.foot2{display:flex;align-items:center;padding:6px 14px 10px;font-size:12px;color:var(--st3);gap:8px}
.stip{position:absolute;z-index:3;padding:6px 8px;border-radius:4px;background:var(--pop);box-shadow:0 0 0 1px var(--sbtnb),0 4px 12px rgba(0,0,0,.3);font-size:12px;white-space:nowrap;color:var(--st1)}
.smenu{position:absolute;z-index:3;padding:4px;border-radius:8px;background:var(--pop);box-shadow:0 0 0 1px var(--sbtnb),0 8px 24px rgba(0,0,0,.35);font-size:14px;min-width:220px}
.smenu div{height:32px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 10px;border-radius:4px;white-space:nowrap}
.smenu div.on{background:var(--ssel)}
.smenu small{color:var(--st3);font-size:12px}
.nores{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 0;color:var(--st3);font-size:13px}
.win{width:792px;background:var(--win);padding:12px;border-radius:8px;color:var(--st1);font-size:14px;line-height:20px}
.gap8{height:8px}
</style>
</head>
<body>
<div id="root"></div>
<script src="wave-1/lucide.js"></script>
<script>
/* Port manager mockups. Sizes are real DIPs; glyphs are Lucide (wave-1/lucide.js plus the few below).
   Every process, port and PID is invented. The island has no Port manager page of its own: it lives in Search,
   a "Free port" picker and its question; the live list is Settings > System > Ports. */
Object.assign(ICONS,{
'refresh-cw':'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
'network':'<rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/>',
'package':'<path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="m7.5 4.27 9 5.15"/>',
'circle-check':'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
'info':'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
'menu':'<line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>',
'globe':'<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>'});
const g=(n,s=16,o='')=>`<svg class="g" width="${s}" height="${s}" viewBox="0 0 24 24" stroke-width="${(30/s).toFixed(3)}"${o}>${ICONS[n]}</svg>`;
/* Windows' own stock UAC shield: it marks a verb that asks Windows for admin */
const sh=(s=14)=>`<svg width="${s}" height="${s}" viewBox="0 0 16 16" style="flex:none;display:block"><defs><clipPath id="shc"><path d="M8 .8 2 2.8v5C2 11 4.4 13.8 8 15.2c3.6-1.4 6-4.2 6-7.4v-5z"/></clipPath></defs><g clip-path="url(#shc)"><rect width="16" height="16" fill="#1B6FD0"/><rect x="8" y="0" width="8" height="8" fill="#F2C21C"/><rect x="0" y="8" width="8" height="8" fill="#F2C21C"/><path d="M8 0v16M0 8h16" stroke="#fff" stroke-opacity=".85" stroke-width=".8"/></g></svg>`;
const q=new URLSearchParams(location.search);
const board=q.get('board')||'sheet-search-holders', theme=q.get('theme')||'dark';
const L=(t,html,sub)=>`<div><p class="cap">${t}${sub?`<small>${sub}</small>`:''}</p>${html}</div>`;
const stage=h=>`<div class="stage">${h}</div>`;
const ib=(t,o={})=>`<button class="ibtn${o.crit?' crit':''}${o.sm?' sm':''}${o.foc?' foc':''}">${o.sh?sh(13):''}${t}</button>`;

/* ---------- invented processes ---------- */
const P={
 node:{n:'node.exe',c:'#3C873A',l:'N',path:'C:\\Program Files\\nodejs\\node.exe'},
 vite:{n:'node.exe',c:'#3C873A',l:'N'},
 java:{n:'java.exe',c:'#E76F00',l:'J'},
 chrome:{n:'chrome.exe',c:'#4285F4',l:'C'},
 edge:{n:'msedge.exe',c:'#0F7BD6',l:'E'},
 pg:{n:'postgres.exe',c:'#336791',l:'P'},
 redis:{n:'redis-server.exe',c:'#C02A22',l:'R'},
 mongo:{n:'mongod.exe',c:'#13894A',l:'M'},
 spool:{n:'spoolsv.exe',gen:1},
 svc:{n:'svchost.exe',gen:1},
 sys:{n:'System',gen:1},
 lsass:{n:'lsass.exe',gen:1},
 chippi:{n:'Chippi',chip:1},
 defender:{n:'MsMpEng.exe',gen:2}
};
const ico=(k,s=20)=>{const p=P[k];
 if(p.chip)return `<span class="mono" style="width:${s}px;height:${s}px;background:linear-gradient(135deg,#B78FFF,#82AEFF);border-radius:${Math.round(s/2)}px"></span>`;
 if(p.gen)return `<span class="mono gen" style="width:${s}px;height:${s}px">${g(p.gen===2?'app-window':'monitor-cog',Math.round(s*.6))}</span>`;
 return `<span class="mono" style="width:${s}px;height:${s}px;background:${p.c};font-size:${Math.round(s*.55)}px">${p.l}</span>`;};

/* ---------- Search (island) ---------- */

  s.push(L('Paused',W(toolbar({paused:1})+ex(around(2),false)+`<div style="font-size:12px;color:var(--st3);padding:0 4px">Paused</div>`)));
  s.push(L('Unreadable process path',W(ex([LISTEN[13],LISTEN[14],LISTEN[0]],false))));
  s.push(L('Free, own process',W(run(2,sEnd('node','End node.exe?','End',0,'PID 4120')))));
  s.push(L('Stop, a service',W(run(9,sEnd('spool','Stop Print Spooler?','Stop',1,'')))));
  s.push(L('Free, admin process',W(run(6,sEnd('pg','End postgres.exe?','End',1,'PID 3340')))));
  s.push(L('Closing, then still running',W(run(2,stripAsk)+`<div class="gap8"></div>`+run(2,sEnd('node','Force end node.exe?','Force end')))));
  s.push(L('Waiting for admin, then freed',W(run(6,stripWait)+`<div class="gap8"></div>`+run(6,stripOk('Port 5432 freed','')))));
  s.push(L('Failures: End failed, Stop failed, Needs admin',W(run(2,stripBad('End failed','','Retry'))+`<div class="gap8"></div>`+run(9,stripBad('Stop failed','','Retry'))+`<div class="gap8"></div>`+run(6,stripBad('Needs admin','','Retry')))));
  s.push(L('Already closed, changed, kept',W(run(2,stripNeu('Already closed',''))+`<div class="gap8"></div>`+run(2,stripNeu('Changed',''))+`<div class="gap8"></div>`+run(0,stripKept('svc','Kept'))+`<div class="gap8"></div>`+run(6,stripKept('pg','Kept')))));
  s.push(L('Settings › Shortcuts',W(shortcutsExcerpt)));
  const rows=[];for(let i=0;i<s.length;i+=2)rows.push(`<div class="srow">${s[i]}${s[i+1]||''}</div>`);return rows.join('');}
};
document.body.className=theme;
const html=B[board]();
const big=/^settings-ports(-all)?(-860)?$|^settings-ports-strip-860$/.test(board);
const wrap=big?`<div style="display:inline-block;padding:24px;background:${theme==='light'?'#D9D9D9':'#161616'}"><div class="${theme}">${html}</div></div>`:`<div class="sheet ${theme==='light'?'lt':''}"><div class="${theme}" style="display:contents">${html}</div></div>`;
document.getElementById('root').innerHTML=wrap;
const el=document.getElementById('root').firstElementChild;
document.body.dataset.size=Math.ceil(el.getBoundingClientRect().width)+','+Math.ceil(el.getBoundingClientRect().height);
</script>
