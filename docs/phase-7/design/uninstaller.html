<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chippi Phase 7: Uninstaller mockups</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;margin:0}
svg.g{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}

/* tokens: Chippi.UI/Themes Dark.xaml / Light.xaml, as in wave-1.html; Caution and Success from DESIGN.md */
.dark{--fill:rgba(40,40,44,.961);--bord:rgba(255,255,255,.09);--hair:rgba(255,255,255,.078);--face:rgba(255,255,255,.024);--faceh:rgba(255,255,255,.10);--cardb:rgba(255,255,255,.059);
 --btn:rgba(255,255,255,.071);--ctlb:rgba(255,255,255,.09);--hov:rgba(255,255,255,.059);--track:rgba(255,255,255,.16);
 --tx:#FFFFFF;--tx2:#C9C9C9;--tx3:#9A9A9A;--acc:#B79CFF;--accf:linear-gradient(135deg,#B78FFF,#82AEFF);--tint:rgba(183,156,255,.14);--onacc:#170F2E;
 --warn:#FCE100;--warntint:rgba(252,225,0,.10);--good:#81CE75;
 --shadow:0 16px 40px rgba(0,0,0,.5);--rim:rgba(255,255,255,.17);--pop:#2C2C2F;
 --win:#202020;--surf:#2B2B2B;--sbord:rgba(255,255,255,.031);--div:rgba(255,255,255,.059);--st1:#FFFFFF;--st2:#C5C5C5;--st3:#ABABAB;--st4:#9D9D9D;
 --ssel:rgba(255,255,255,.059);--sbtn:rgba(255,255,255,.059);--sbtnb:rgba(255,255,255,.09);--sacc:#B79CFF;--sonacc:#000;--field:rgba(255,255,255,.059);--kcap:rgba(255,255,255,.09);--sck:rgba(0,0,0,.1);--skel:rgba(255,255,255,.07)}
.light{--fill:rgba(245,245,246,.961);--bord:rgba(0,0,0,.078);--hair:rgba(0,0,0,.078);--face:rgba(255,255,255,.45);--faceh:#FFFFFF;--cardb:rgba(0,0,0,.059);
 --btn:rgba(255,255,255,.86);--ctlb:rgba(0,0,0,.09);--hov:rgba(0,0,0,.043);--track:rgba(0,0,0,.14);
 --tx:#1A1A1A;--tx2:#5C5C5C;--tx3:#707070;--acc:#7444F0;--accf:linear-gradient(135deg,#8F5CFF,#5B86FF);--tint:rgba(116,68,240,.10);--onacc:#FFFFFF;
 --warn:#9D5D00;--warntint:rgba(157,93,0,.10);--good:#0F7B0F;
 --shadow:0 16px 40px rgba(0,0,0,.2);--rim:rgba(0,0,0,.12);--pop:#F9F9F9;
 --win:#F3F3F3;--surf:#FBFBFB;--sbord:rgba(0,0,0,.059);--div:rgba(0,0,0,.071);--st1:#1A1A1A;--st2:#404040;--st3:#5D5D5D;--st4:#616161;
 --ssel:rgba(0,0,0,.055);--sbtn:#FFFFFF;--sbtnb:rgba(0,0,0,.10);--sacc:#6B4FBB;--sonacc:#FFF;--field:#FFFFFF;--kcap:rgba(0,0,0,.06);--sck:#FFFFFF;--skel:rgba(0,0,0,.06)}

.sheet{display:inline-flex;flex-direction:column;gap:28px;padding:32px;background:#161616;color:#E6E6E6}
.sheet.lt{background:#D9D9D9;color:#1A1A1A}
.srow{display:flex;gap:28px;align-items:flex-start}
.cap{font-size:13px;line-height:18px;font-weight:600;margin:0 0 8px;max-width:520px}
.stage{background:#1F1F1F;padding:24px 32px 32px;border-radius:2px}
.lt .stage{background:#C8CBD2}
.desk{background:#3A3F4B;padding:16px 20px;border-radius:2px}
.lt .desk{background:#AEB6C4}

/* ---------- island panel 520x360 ---------- */
.panel{position:relative;width:520px;height:360px;padding:12px;background:var(--fill);border:1px solid var(--bord);border-radius:8px;box-shadow:var(--shadow);color:var(--tx);font-size:12px;line-height:16px;overflow:hidden}
.hdr{display:flex;align-items:center;height:24px;margin-bottom:8px;gap:6px}
.ib{width:28px;height:24px;display:inline-flex;align-items:center;justify-content:center;border:0;padding:0;border-radius:4px;background:transparent;color:var(--tx2);flex:none}
.ib.back{margin:0 0 0 -4px}
.ttl{flex:1;font-size:13px;font-weight:600;line-height:20px;white-space:nowrap}
.body{position:relative;width:494px;height:302px}
.ibtn{height:28px;padding:0 10px;border-radius:4px;border:1px solid var(--ctlb);background:var(--btn);font-size:12px;color:var(--tx);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-width:64px;justify-content:center;flex:none}
.ibtn.acc{background:var(--accf);border-color:transparent;color:var(--onacc);font-weight:600}
.ibtn.crit{background:#C42B1C;border-color:transparent;color:#fff}
.ibtn.sm{height:24px;min-width:0;padding:0 8px;font-size:11px}
.ibtn.foc{outline:2px solid var(--tx);outline-offset:1px}
.ibtn.dis{opacity:.45}
.t3{color:var(--tx3);font-size:11px}
.t2{color:var(--tx2)}
.warn{color:var(--warn)}
.good{color:var(--good)}
.lrow{height:42px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:4px}
.lrow.hov{background:var(--hov)}
.lrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{height:18px;padding:0 6px;border-radius:4px;background:var(--btn);font-size:11px;font-weight:600;color:var(--tx2);display:inline-flex;align-items:center;white-space:nowrap;flex:none}
.badge.new{background:var(--tint);color:var(--acc)}
.badge.w{background:var(--warntint);color:var(--warn)}
.q{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--fill)}
.q .qt{font-size:14px;font-weight:600}
.isr{height:36px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:4px}
.isr.sel{background:var(--tint)}
.isr .ld{width:22px;display:flex;justify-content:center;color:var(--tx2);flex:none}
.isr .tt{min-width:0;flex:1}
.isr .nm{font-size:12px;line-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.isr .dt{font-size:11px;line-height:14px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.isr .vb{margin-left:auto;font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px;flex:none}
.sfield{flex:1;height:32px;border-radius:4px;border:1px solid var(--ctlb);border-bottom:2px solid var(--acc);background:var(--btn);display:flex;align-items:center;gap:8px;padding:0 10px;font-size:13px}
.sfield .ph{color:var(--tx3)}
.caret{width:1px;height:16px;background:var(--tx);margin-left:-6px}
.foot{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:flex-end;align-items:center;height:26px}
.ctr{height:302px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.ctr .ct{font-size:14px;font-weight:600}
.ctr .cd{font-size:12px;color:var(--tx2)}
.ctr .cb{display:flex;gap:8px;margin-top:8px}
.ctr>svg{color:var(--tx2);margin-bottom:2px}
.trk{height:4px;border-radius:2px;background:var(--track);position:relative;width:180px;overflow:hidden;margin-top:2px}
.trk i{position:absolute;top:0;bottom:0;border-radius:2px;background:var(--accf)}
.aic{border-radius:6px;color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex:none;letter-spacing:-.2px}
.menu2{display:grid;grid-template-columns:1fr 1fr;column-gap:8px;grid-template-rows:repeat(5,42px);grid-auto-flow:column}

/* bar 256x50 */
.bar{width:256px;height:50px;border-radius:25px;background:var(--fill);box-shadow:0 0 0 1px var(--rim),0 6px 16px rgba(0,0,0,.35);display:flex;align-items:center;color:var(--tx)}
.bar .lead{width:34px;height:34px;border-radius:17px;background:var(--tint);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.bar .lead.cau{background:var(--warntint);color:var(--warn)}
.bar .lead.ok{background:rgba(129,206,117,.16);color:var(--good)}
.light .bar .lead.ok{background:rgba(15,123,15,.10)}
.bar .lines{flex:1;min-width:0;display:flex;flex-direction:column}
.bar .bt{font-size:13px;font-weight:600;line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .bt.cau{color:var(--warn)}
.bar .ba{font-size:12px;line-height:15px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pet{width:46px;height:50px;display:flex;align-items:center;justify-content:center;flex:none}
.pet span{width:34px;height:30px;border-radius:15px 15px 13px 13px;background:linear-gradient(160deg,#C9B6FF,#8E7BE8)}

/* ---------- Settings window 1120x720 (DESIGN.md default) ---------- */
.sw1{width:1120px;height:720px;position:relative;background:var(--win);color:var(--st1);font-size:14px;line-height:20px;border:1px solid rgba(128,128,128,.35);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.sw1.nar{width:860px}
.tbar{height:40px;display:flex;align-items:center;flex:none;font-size:12px}
.tbar .logo{width:16px;height:16px;border-radius:8px;background:linear-gradient(135deg,#B78FFF,#82AEFF);margin:0 9px 0 16px}
.tbar .tt{flex:1}
.tbar .cb{width:46px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--st2)}
.shell{display:flex;flex:1;min-height:0}
.side{width:272px;flex:none;padding:6px 12px 16px;overflow:hidden}
.rail{width:48px;flex:none;padding:6px 6px;display:flex;flex-direction:column;gap:2px;align-items:center;color:var(--st2)}
.rail .nv{position:relative;width:36px;height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center}
.rail .nv.sel{background:var(--ssel);color:var(--st1)}
.rail .nv.sel::before{content:"";position:absolute;left:-6px;top:8px;width:3px;height:16px;border-radius:2px;background:var(--sacc)}
.rail .hr{height:1px;width:28px;background:var(--div);margin:4px 0}
.find{height:32px;margin:0 0 8px;padding:0 10px;border-radius:4px;background:var(--field);border:1px solid var(--sbtnb);display:flex;align-items:center;gap:10px;font-size:14px;color:var(--st4)}
.gl{font-size:12px;font-weight:400;color:var(--st2);padding:10px 12px 2px;line-height:16px}
.nav{position:relative;height:32px;margin:2px 4px;padding:0 12px;border-radius:4px;display:flex;align-items:center;gap:12px;white-space:nowrap;color:var(--st1)}
.nav.sel{background:var(--ssel);font-weight:600}
.nav.sel::before{content:"";position:absolute;left:-4px;top:8px;width:3px;height:16px;border-radius:2px;background:var(--sacc)}
.page{flex:1;min-width:0;padding:4px 40px 0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.ptitle{font-family:'Segoe UI Variable Display','Segoe UI',sans-serif;font-size:20px;font-weight:600;line-height:28px;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex:none}
.tabs{display:flex;height:40px;flex:none;margin:-2px 0 8px -12px}
.tab{padding:0 12px;display:flex;align-items:center;gap:6px;color:var(--st2);position:relative;font-size:14px}
.tab.sel{color:var(--st1);font-weight:600}
.tab.sel::after{content:"";position:absolute;left:12px;bottom:3px;width:16px;height:3px;border-radius:2px;background:var(--sacc)}
.tab .n{font-size:12px;color:var(--st3);font-weight:400}
.tool{display:flex;gap:8px;align-items:center;height:32px;flex:none}
.sfld{flex:1;min-width:0;height:32px;border-radius:4px;background:var(--field);border:1px solid var(--sbtnb);display:flex;align-items:center;gap:10px;padding:0 10px;font-size:14px}
.sfld .ph{color:var(--st4)}
.sfld.foc{border-bottom:2px solid var(--st1)}
.scaret{width:1px;height:18px;background:var(--st1);margin-left:-8px}
.chip{height:32px;padding:0 12px;border-radius:4px;border:1px solid var(--sbtnb);background:var(--sbtn);display:inline-flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap;flex:none}
.chip.on{background:var(--sacc);border-color:var(--sacc);color:var(--sonacc)}
.cnt{height:28px;flex:none;display:flex;align-items:center;font-size:12px;color:var(--st3);gap:6px}
.cnt .sp{flex:1}
.lwrap{position:relative;flex:1;min-height:0;margin-bottom:28px}
.lcard{background:var(--surf);border:1px solid var(--sbord);border-radius:8px;overflow:hidden;position:relative;height:100%}
.lcard.fit{height:auto}
.lh{height:36px;display:grid;grid-template-columns:var(--cols);column-gap:10px;padding:0 16px;align-items:center;font-size:12px;color:var(--st3);border-bottom:1px solid var(--div)}
.lh .s{display:flex;align-items:center;gap:4px}
.lh .s.on{color:var(--st1);font-weight:600}
.lr{height:48px;display:grid;grid-template-columns:var(--cols);column-gap:10px;padding:0 16px;align-items:center;border-top:1px solid var(--div)}
.lr:first-of-type{border-top:0}
.lr.hov{background:var(--ssel)}
.lr.dim .n1,.lr.dim .pc,.lr.dim .sc{color:var(--st3)}
.nc{min-width:0}
.n1{font-size:14px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.n1 span.t{overflow:hidden;text-overflow:ellipsis}
.n2{font-size:12px;line-height:16px;color:var(--st3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.n2.w{color:var(--warn)}
.n2.g{color:var(--good)}
.pc,.sc{font-size:13px;color:var(--st2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc.r{text-align:right}
.ac{display:flex;gap:4px;justify-content:flex-end;align-items:center}
.ac .stt{font-size:12px;color:var(--st2);white-space:nowrap;display:flex;align-items:center;gap:5px;margin-right:4px}
.sck{width:20px;height:20px;border-radius:4px;border:1px solid var(--st3);background:var(--sck);display:inline-flex;align-items:center;justify-content:center;flex:none}
.sck.on{background:var(--sacc);border-color:var(--sacc);color:var(--sonacc)}
.sck.dis{opacity:.45}
.sbt{height:32px;padding:0 12px;border-radius:4px;border:1px solid var(--sbtnb);background:var(--sbtn);font-size:14px;color:var(--st1);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;flex:none}
.sbt.sm{height:28px;padding:0 10px;font-size:13px;gap:6px}
.sbt.acc{background:var(--sacc);border-color:var(--sacc);color:var(--sonacc)}
.sbt.crit{background:#C42B1C;border-color:#C42B1C;color:#fff}
.sbt.dis{opacity:.45}
.sbt.foc{outline:2px solid var(--st1);outline-offset:1px}
.sib{width:28px;height:28px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--st2);flex:none}
.sib.hov{background:var(--ssel);color:var(--st1)}
.sib.dis{opacity:.45}
.sbadge{height:18px;padding:0 6px;border-radius:4px;background:var(--kcap);font-size:11px;font-weight:600;color:var(--st2);display:inline-flex;align-items:center;white-space:nowrap;flex:none}
.sbadge.new{background:rgba(183,156,255,.16);color:var(--sacc)}
.light .sbadge.new{background:rgba(107,79,187,.12)}
.sbadge.w{background:var(--warntint);color:var(--warn)}
.sbadge.g{background:rgba(129,206,117,.14);color:var(--good)}
.light .sbadge.g{background:rgba(15,123,15,.10)}
.prg{height:3px;width:160px;border-radius:2px;background:var(--div);position:relative;overflow:hidden;margin-top:3px}
.prg i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--sacc)}
.pbar{position:absolute;left:0;right:0;bottom:0;height:60px;background:var(--win);border-top:1px solid var(--div);padding:0 40px;display:flex;align-items:center;gap:8px;z-index:3}
.pbar .sp{flex:1}
.pbar .tx{font-size:14px}
.pbar .tx small{color:var(--st3);font-size:12px;margin-left:6px}
.spop{position:absolute;z-index:6;padding:16px;background:var(--surf);border-radius:8px;box-shadow:0 0 0 1px var(--sbtnb),0 12px 32px rgba(0,0,0,.4)}
.spop h3{font-size:16px;line-height:24px;font-weight:600;margin:0 0 8px}
.spop .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.spop .cl{background:var(--ssel);border-radius:6px;padding:4px 10px}
.spop .cr{display:flex;align-items:center;gap:8px;min-height:30px;font-size:13px}
.spop .cr .v{margin-left:auto;color:var(--st3);font-size:12px}
.spop p{margin:0;font-size:13px;line-height:18px;color:var(--st2)}
.spop p+p{margin-top:6px}
.fsb{position:absolute;right:2px;width:2px;border-radius:1px;background:rgba(128,128,128,.7)}
.sk{height:10px;border-radius:5px;background:var(--skel)}
.emptyrow{min-height:48px;display:flex;align-items:center;gap:10px;padding:6px 16px;color:var(--st3);font-size:14px}
.sh{font-size:14px;font-weight:600;line-height:20px;margin:16px 0 6px}
.scard{background:var(--surf);border:1px solid var(--sbord);border-radius:8px;margin-bottom:8px}
.sr{min-height:48px;display:flex;align-items:center;padding:6px 16px;gap:12px;border-top:1px solid var(--div)}
.sr:first-child{border-top:0}
.sr .lead{width:20px;height:20px;color:var(--st1);flex:none;display:flex;align-items:center}
.sr .tl{flex:1;min-width:0}
.kc{height:26px;min-width:26px;padding:0 8px;border-radius:4px;background:var(--kcap);border:1px solid var(--sbtnb);border-bottom-width:2px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--st1)}
.edit{color:var(--st1);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.path{color:var(--st3);font-size:14px;white-space:nowrap}
/* review */
.gh{height:44px;display:grid;grid-template-columns:20px 16px minmax(0,1fr) auto;column-gap:10px;padding:0 16px;align-items:center;border-top:1px solid var(--div)}
.gh .gt{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.gh .gt small{font-weight:400;font-size:12px;color:var(--st3)}
.rr{min-height:52px;display:grid;grid-template-columns:20px 20px minmax(0,1fr) 76px 24px;column-gap:10px;padding:4px 16px;align-items:center;border-top:1px solid var(--div)}
.rr.dim{opacity:.62}
.rr .pth{font-size:13px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--st1)}
.rr .why{font-size:12px;line-height:16px;color:var(--st3);display:flex;gap:6px;align-items:center}
.rr .why.w{color:var(--warn)}
.rr .why.g{color:var(--good)}
.rr .ks{color:var(--st2)}
.rr .sz{font-size:12px;color:var(--st2);text-align:right}
.rr .stt{font-size:12px;white-space:nowrap}
.rr .stt.w{color:var(--warn)}
.rhd{height:36px;display:grid;grid-template-columns:20px 20px minmax(0,1fr) 76px 24px;column-gap:10px;padding:0 16px;align-items:center;font-size:12px;color:var(--st3)}
.sum{min-height:52px;display:flex;align-items:center;gap:12px;padding:6px 16px}
.sum .tl{flex:1;min-width:0}
</style>
</head>

<div id="root"></div>

<script>

   return `<div class="rr" style="opacity:.6"><span>${ck(1)}</span><span class="ks">${kg(it.k)}</span><span style="min-width:0"><div class="pth">${it.p}</div><div class="why">${it.why}</div></span><span class="sz">${it.sz}</span><span>${it.adm?uac(16):''}</span></div>`}).join('');
 return frame(revHead('Firefox leftovers')+rcard(body)+pbar(`<span class="tx">Removing 4 of 10</span><span class="prg" style="width:200px;margin:0 0 0 8px"><i style="width:40%"></i></span><span class="sp"></span>`));
};
const resBody=(admin)=>{
 const items=SAFE.map(it=>admin&&it.adm?{...it,st:'admin'}:it);
 const bad=items.filter(i=>i.st!=='ok'),good=items.filter(i=>i.st==='ok');
 const head1=admin?`<div class="sum"><span class="warn">${g('circle-alert',20)}</span><span class="tl"><div>Needs admin</div><div style="font-size:12px;color:var(--st3)">8 items were not removed. Remove leftovers asks Windows again</div></span>${sbt('Remove leftovers',{sm:1,sh:1})}</div>`:`<div class="sum"><span class="good">${g('circle-check',20)}</span><span class="tl"><div>7 removed</div><div style="font-size:12px;color:var(--st3)">1 in use · 1 kept · 1 failed</div></span></div>`;
 const backup=`<div class="sum" style="border-top:1px solid var(--div)"><span style="color:var(--st2)">${g('file',20)}</span><span class="tl"><div>2 keys saved before removal</div><div style="font-size:12px;color:var(--st3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${BK}</div></span>${sbt('Open folder',{sm:1,g:'folder-open'})}</div>`;
 return head1+backup+grp('Needs a look','<span class="sbadge w">'+bad.length+'</span>','',null)+bad.map(it=>rrow(it,{res:1})).join('')+grp('Removed','<span class="sbadge g">'+good.length+'</span>','',null,false);
};
B['settings-results']=()=>frame(revHead('Firefox leftovers')+rcard(resBody(false))+pbar(`<span class="sp"></span>${sbt('Done',{acc:1})}`));
B['settings-results-norecord']=()=>{
 const kept=[{k:'folder',p:'C:\\Program Files\\Mozilla Firefox',sz:'1.2 MB',st:'kept:no uninstall record'},{k:'folder',p:'C:\\ProgramData\\Mozilla-1de4eec8-1241-4177-a864-acaac3b1b5ae',sz:'38 MB',st:'kept:no uninstall record'},{k:'key',p:'HKLM\\SOFTWARE\\Mozilla\\Firefox\\132.0.1 (x64 en-US)',sz:'',st:'kept:no uninstall record'}];
 const gone=CHECK.map(it=>({...it,st:'ok'}));
 const sum=`<div class="sum"><span class="good">${g('circle-check',20)}</span><span class="tl"><div>3 removed</div><div style="font-size:12px;color:var(--st3)">3 kept. Items under Program Files or HKLM need an uninstall record, so Scan for leftovers can remove them once it has one</div></span></div>`;
 return frame(revHead('Firefox leftovers')+rcard(sum+grp('Needs a look','<span class="sbadge w">3</span>','',null)+kept.map(it=>rrow(it,{res:1})).join('')+grp('Removed','<span class="sbadge g">3</span>','',null,false)+gone.map(it=>rrow(it,{res:1})).join(''))+pbar(`<span class="sp"></span>${sbt('Done',{acc:1})}`));
};
B['settings-results-admin']=()=>frame(revHead('Firefox leftovers')+rcard(resBody(true))+pbar(`<span class="sp"></span>${sbt('Done',{acc:1})}`));

document.body.className=theme;
const html=B[board]();
const wrap=board.startsWith('sheet')?`<div class="sheet ${theme==='light'?'lt':''}"><div class="${theme}" style="display:contents">${html}</div></div>`:`<div style="display:inline-block;padding:24px;background:${theme==='light'?'#D9D9D9':'#161616'}"><div class="${theme}">${html}</div></div>`;
document.getElementById('root').innerHTML=wrap;
const el=document.getElementById('root').firstElementChild;
document.body.dataset.size=Math.ceil(el.getBoundingClientRect().width)+','+Math.ceil(el.getBoundingClientRect().height);
</script>
