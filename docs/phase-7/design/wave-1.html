<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chippi Phase 7: wave 1 mockups</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;margin:0}
svg.g{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}

/* island tokens (Chippi.UI/Themes Dark.xaml / Light.xaml, as in docs/phase-6/design) */
.dark{--fill:rgba(40,40,44,.961);--bord:rgba(255,255,255,.09);--hair:rgba(255,255,255,.078);--face:rgba(255,255,255,.024);--faceh:rgba(255,255,255,.10);--cardb:rgba(255,255,255,.059);
 --btn:rgba(255,255,255,.071);--ctlb:rgba(255,255,255,.09);--hov:rgba(255,255,255,.059);--track:rgba(255,255,255,.16);
 --tx:#FFFFFF;--tx2:#C9C9C9;--tx3:#9A9A9A;--acc:#B79CFF;--accf:linear-gradient(135deg,#B78FFF,#82AEFF);--tint:rgba(183,156,255,.14);--onacc:#170F2E;--cau:#FF99A4;--cautint:rgba(255,153,164,.16);--crit:#FF99A4;
 --shadow:0 16px 40px rgba(0,0,0,.5);--rim:rgba(255,255,255,.17);--pop:#2C2C2F;
 --win:#202020;--surf:#2B2B2B;--sbord:rgba(255,255,255,.031);--div:rgba(255,255,255,.059);--st1:#FFFFFF;--st2:#C5C5C5;--st3:#ABABAB;--st4:#9D9D9D;--scau:#FF99A4;
 --ssel:rgba(255,255,255,.059);--sbtn:rgba(255,255,255,.059);--sbtnb:rgba(255,255,255,.09);--sacc:#B79CFF;--sonacc:#000;--field:rgba(255,255,255,.059);--fieldb:rgba(255,255,255,.55);--kcap:rgba(255,255,255,.09)}
.light{--fill:rgba(245,245,246,.961);--bord:rgba(0,0,0,.078);--hair:rgba(0,0,0,.078);--face:rgba(255,255,255,.45);--faceh:#FFFFFF;--cardb:rgba(0,0,0,.059);
 --btn:rgba(255,255,255,.86);--ctlb:rgba(0,0,0,.09);--hov:rgba(0,0,0,.043);--track:rgba(0,0,0,.14);
 --tx:#1A1A1A;--tx2:#5C5C5C;--tx3:#707070;--acc:#7444F0;--accf:linear-gradient(135deg,#8F5CFF,#5B86FF);--tint:rgba(116,68,240,.10);--onacc:#FFFFFF;--cau:#C42B1C;--cautint:rgba(196,43,28,.10);--crit:#C42B1C;
 --shadow:0 16px 40px rgba(0,0,0,.2);--rim:rgba(0,0,0,.12);--pop:#F9F9F9;
 --win:#F3F3F3;--surf:#FBFBFB;--sbord:rgba(0,0,0,.059);--div:rgba(0,0,0,.071);--st1:#1A1A1A;--st2:#404040;--st3:#5D5D5D;--st4:#616161;--scau:#C42B1C;
 --ssel:rgba(0,0,0,.055);--sbtn:#FFFFFF;--sbtnb:rgba(0,0,0,.10);--sacc:#6B4FBB;--sonacc:#FFF;--field:#FFFFFF;--fieldb:rgba(0,0,0,.45);--kcap:rgba(0,0,0,.06)}

.sheet{display:inline-flex;flex-direction:column;gap:28px;padding:32px;background:#161616;color:#E6E6E6}
.sheet.lt{background:#D9D9D9;color:#1A1A1A}
.srow{display:flex;gap:28px;align-items:flex-start}
.cap{font-size:13px;line-height:18px;font-weight:600;margin:0 0 8px;max-width:640px}
.stage{background:#1F1F1F;padding:24px 32px 32px;border-radius:2px}
.lt .stage{background:#C8CBD2}

/* island panel 520x360 */
.panel{position:relative;width:520px;height:360px;padding:12px;background:var(--fill);border:1px solid var(--bord);border-radius:8px;box-shadow:var(--shadow);color:var(--tx);font-size:12px;line-height:16px;overflow:hidden}
.hdr{display:flex;align-items:center;height:24px;margin-bottom:8px;gap:6px}
.ib{width:28px;height:24px;display:inline-flex;align-items:center;justify-content:center;border:0;padding:0;border-radius:4px;background:transparent;color:var(--tx2);flex:none}
.ib.back{margin:0 0 0 -4px}
.ttl{flex:1;font-size:13px;font-weight:600;line-height:20px;white-space:nowrap}
.body{position:relative;width:494px;height:302px}
.ibtn{height:28px;padding:0 10px;border-radius:4px;border:1px solid var(--ctlb);background:var(--btn);font-size:12px;color:var(--tx);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-width:64px;justify-content:center;flex:none}
.ibtn.acc{background:var(--accf);border-color:transparent;color:var(--onacc);font-weight:600}
.ibtn.crit{background:var(--crit);border-color:transparent;color:#000}
.light .ibtn.crit{color:#fff}
.ibtn.sm{height:24px;min-width:0;padding:0 8px;font-size:11px}
.ibtn.ghost{background:transparent;border-color:transparent;color:var(--tx2)}
.seg{display:inline-flex;height:24px;border-radius:4px;background:var(--hov);padding:2px;gap:2px;font-size:11px}
.seg span{padding:0 8px;border-radius:3px;display:flex;align-items:center;color:var(--tx2)}
.seg span.on{background:var(--btn);color:var(--tx);font-weight:600;box-shadow:0 0 0 1px var(--ctlb)}
.combo{height:24px;padding:0 6px 0 8px;border-radius:4px;border:1px solid var(--ctlb);background:var(--btn);display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--tx);white-space:nowrap}
.combo.open{border-color:var(--acc)}
.menu{position:absolute;z-index:3;padding:4px;border-radius:8px;background:var(--pop);box-shadow:0 0 0 1px var(--bord),0 8px 24px rgba(0,0,0,.35);font-size:12px;min-width:132px}
.menu div{height:30px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:4px;white-space:nowrap}
.menu div.on{background:var(--tint)}
.menu div .ck{width:14px;color:var(--acc)}
.grid6{display:grid;grid-template-columns:repeat(6,76px);gap:8px}
.cc{height:64px;border:1px solid var(--cardb);border-radius:6px;background:var(--face);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--tx2);font-size:12px;position:relative}
.cc span{color:var(--tx)}
.cc.pri{background:var(--accf);border-color:transparent;color:var(--onacc)}
.cc.pri span{color:var(--onacc);font-weight:600}
.cc.hov{background:var(--faceh)}
.cc.foc{outline:2px solid var(--tx);outline-offset:1px}
.tip{position:absolute;z-index:3;padding:6px 8px;border-radius:4px;background:var(--pop);box-shadow:0 0 0 1px var(--bord),0 4px 12px rgba(0,0,0,.3);font-size:12px;white-space:nowrap;color:var(--tx)}
.sub{display:flex;align-items:center;height:28px;margin-top:12px}
.sub b{flex:1;font-size:12px;font-weight:600}
.thumbs{display:grid;grid-template-columns:repeat(4,118px);gap:8px;margin-top:4px}
.th .img{height:66px;border-radius:6px;border:1px solid var(--hair);position:relative;overflow:hidden}
.th .n{font-size:11px;line-height:14px;color:var(--tx2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .m{font-size:11px;line-height:14px;color:var(--tx3)}
.dur{position:absolute;right:4px;bottom:4px;height:16px;padding:0 4px;border-radius:3px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;line-height:16px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--tx3);font-size:12px}
.card{border:1px solid var(--cardb);border-radius:6px;background:var(--face)}
.foot{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:flex-end;align-items:center}
.foot .l{margin-right:auto;display:flex;gap:6px;align-items:center}
.big{font-size:20px;font-weight:600;line-height:26px}
.t3{color:var(--tx3);font-size:11px}
.t2{color:var(--tx2)}
.cau{color:var(--cau)}
.slider{flex:1;height:18px;position:relative}
.slider::before{content:"";position:absolute;left:0;right:0;top:7px;height:4px;border-radius:2px;background:var(--track)}
.slider i{position:absolute;left:0;top:7px;height:4px;border-radius:2px;background:var(--accf)}
.slider b{position:absolute;top:0;width:18px;height:18px;margin-left:-9px;border-radius:9px;background:var(--fill);box-shadow:0 0 0 1px var(--ctlb),0 1px 3px rgba(0,0,0,.3)}
.slider b::after{content:"";position:absolute;left:4px;top:4px;width:10px;height:10px;border-radius:5px;background:var(--acc)}
.drow{height:44px;display:flex;align-items:center;gap:10px;padding:0 10px;margin-bottom:8px;color:var(--tx2)}
.drow .nm{width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx)}
.drow .pc{width:34px;text-align:right;color:var(--tx2)}
.lrow{height:36px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:4px}
.lrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* bar 256x50 */
.desk{background:#3A3F4B;padding:16px 20px;border-radius:2px}
.lt .desk{background:#AEB6C4}
.bar{width:256px;height:50px;border-radius:25px;background:var(--fill);box-shadow:0 0 0 1px var(--rim),0 6px 16px rgba(0,0,0,.35);display:flex;align-items:center;color:var(--tx)}
.bar .lead{width:34px;height:34px;border-radius:17px;background:var(--tint);color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.bar .lead.cau{background:var(--cautint);color:var(--cau)}
.bar .lines{flex:1;min-width:0;display:flex;flex-direction:column}
.bar .bt{font-size:13px;font-weight:600;line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .bt.cau{color:var(--cau)}
.bar .ba{font-size:12px;line-height:15px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pet{width:46px;height:50px;display:flex;align-items:center;justify-content:center;flex:none}
.pet span{width:34px;height:30px;border-radius:15px 15px 13px 13px;background:linear-gradient(160deg,#C9B6FF,#8E7BE8)}

/* the frozen screen, at real size (DIPs) */
.scr{position:relative;width:1100px;height:640px;overflow:hidden;border-radius:2px;background:linear-gradient(160deg,#2C3E57,#1B2838);font-size:12px}
.scr.sm{width:620px;height:380px}
.w{position:absolute;border-radius:8px;background:#F3F3F3;box-shadow:0 8px 24px rgba(0,0,0,.4);overflow:hidden}
.w .tb{height:32px;background:#E8E8E8;display:flex;align-items:center;padding:0 12px;font-size:12px;color:#333}
.w .ln{height:10px;margin:12px 16px 0;border-radius:3px;background:#D5D5D5}
.w .ln.s{width:40%}
.w.dk{background:#1E1E1E}.w.dk .tb{background:#2B2B2B;color:#ddd}.w.dk .ln{background:#3A3A3A}
.dim{position:absolute;background:rgba(0,0,0,.45)}
.selx{position:absolute;border:1px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.hdl{position:absolute;width:8px;height:8px;background:#fff;border:1px solid #7444F0;margin:-4px 0 0 -4px}
.whl{position:absolute;border:2px solid #B79CFF;border-radius:8px}
.spill{position:absolute;height:22px;padding:0 8px;border-radius:4px;background:rgba(32,32,36,.92);color:#fff;font-size:11px;line-height:22px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.mag{position:absolute;width:112px;height:112px;border-radius:56px;border:2px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.5);overflow:hidden;background:
 repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 8px),repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 1px,transparent 1px 8px),linear-gradient(90deg,#F3F3F3 0 46%,#2C3E57 46%)}
.mag::after{content:"";position:absolute;left:52px;top:52px;width:8px;height:8px;box-shadow:0 0 0 1px #000,0 0 0 2px #fff}
.ptr{position:absolute;width:16px;height:16px;color:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.ptr svg{fill:#fff;stroke:#000}
.tools{position:absolute;width:40px;padding:4px;border-radius:8px;background:var(--fill);box-shadow:0 0 0 1px var(--bord),var(--shadow);display:flex;flex-direction:column;color:var(--tx2)}
.tools .t{width:32px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:4px}
.tools .t.on{background:var(--tint);color:var(--acc)}
.tools .sep{height:1px;background:var(--hair);margin:4px 2px}
.swd{width:14px;height:14px;border-radius:7px;box-shadow:0 0 0 2px var(--fill),0 0 0 3px var(--ctlb)}
.acts{position:absolute;height:40px;padding:6px;border-radius:8px;background:var(--fill);box-shadow:0 0 0 1px var(--bord),var(--shadow);display:flex;gap:6px;align-items:center;color:var(--tx)}
.acts .vsep{width:1px;height:20px;background:var(--hair)}
.pop{position:absolute;z-index:4;padding:8px;border-radius:8px;background:var(--fill);box-shadow:0 0 0 1px var(--bord),var(--shadow);color:var(--tx)}
.mk{position:absolute;overflow:visible}

/* Settings, from the real window (r2 snapshots on main 9a978b7) */
.sw1{width:1120px;background:var(--win);color:var(--st1);font-size:14px;line-height:20px;border:1px solid rgba(128,128,128,.35);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.tbar{height:40px;display:flex;align-items:center;flex:none;font-size:12px}
.tbar .logo{width:16px;height:16px;border-radius:8px;background:linear-gradient(135deg,#B78FFF,#82AEFF);margin:0 9px 0 16px}
.tbar .tt{flex:1}
.tbar .cb{width:46px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--st2)}
.shell{display:flex;flex:1}
.side{width:272px;flex:none;padding:6px 12px 16px}
.find{height:32px;margin:0 0 8px;padding:0 10px;border-radius:4px;background:var(--field);border:1px solid var(--sbtnb);display:flex;align-items:center;gap:10px;font-size:14px;color:var(--st4)}
.gl{font-size:12px;font-weight:400;color:var(--st2);padding:10px 12px 2px;line-height:16px}
.nav{position:relative;height:32px;margin:2px 4px;padding:0 12px;border-radius:4px;display:flex;align-items:center;gap:12px;white-space:nowrap;color:var(--st1)}
.nav.sel{background:var(--ssel);font-weight:600}
.nav.sel::before{content:"";position:absolute;left:-4px;top:8px;width:3px;height:16px;border-radius:2px;background:var(--sacc)}
.page{flex:1;padding:4px 40px 28px 40px;min-width:0}
.ptitle{font-family:'Segoe UI Variable Display','Segoe UI',sans-serif;font-size:20px;font-weight:600;line-height:28px;margin:0 0 8px}
.sh{font-size:14px;font-weight:600;line-height:20px;margin:16px 0 6px}
.scard{background:var(--surf);border:1px solid var(--sbord);border-radius:8px;margin-bottom:8px}
.sr{min-height:48px;display:flex;align-items:center;padding:6px 16px;gap:12px;border-top:1px solid var(--div)}
.sr:first-child{border-top:0}
.sr.cap2{min-height:60px}
.sr .lead{width:20px;height:20px;color:var(--st1);flex:none;display:flex;align-items:center}
.sr .tl{flex:1;min-width:0}
.sr .tl small{display:block;font-size:12px;line-height:16px;color:var(--st3)}
.sr .tl small.cau{color:var(--scau)}
.sr.dep{padding-left:50px}
.sr.grp{min-height:36px;padding-top:12px;padding-bottom:0;font-size:12px;color:var(--st3)}
.sbt{height:32px;padding:0 12px;border-radius:4px;border:1px solid var(--sbtnb);background:var(--sbtn);font-size:14px;color:var(--st1);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.scombo{height:32px;min-width:200px;padding:0 10px 0 11px;border-radius:4px;border:1px solid var(--sbtnb);background:var(--sbtn);display:inline-flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;white-space:nowrap}
.ssw{width:40px;height:20px;border-radius:10px;border:1px solid var(--st3);position:relative;flex:none}
.ssw::after{content:"";position:absolute;left:4px;top:4px;width:10px;height:10px;border-radius:5px;background:var(--st2)}
.ssw.on{background:var(--sacc);border-color:var(--sacc)}.ssw.on::after{left:auto;right:4px;width:12px;height:12px;top:3px;background:var(--sonacc)}
.onl{font-size:14px;color:var(--st1)}
.kc{height:26px;min-width:26px;padding:0 8px;border-radius:4px;background:var(--kcap);border:1px solid var(--sbtnb);border-bottom-width:2px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--st1)}
.keys{width:200px;display:flex;gap:4px;align-items:center;color:var(--st3);font-size:14px}
.edit{color:var(--st1);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.path{color:var(--st3);font-size:14px;white-space:nowrap}
.sthumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:12px 16px 16px}
.sthumbs div{height:70px;border-radius:4px;border:1px solid var(--div)}
.palette{display:flex;gap:6px}
.palette span{width:22px;height:22px;border-radius:11px;box-shadow:0 0 0 1px var(--div)}
</style>
</head>
<body>
<div id="root"></div>
<script src="wave-1/lucide.js"></script>
<script>
// Wave 1 mockups. Sizes are real DIPs; glyphs are Lucide (wave-1/lucide.js). Every window, file and number is invented,
// except Travis's two monitors' names, which the real Settings › Snap already shows.
const g=(n,s=16,o='')=>`<svg class="g" width="${s}" height="${s}" viewBox="0 0 24 24" stroke-width="${(30/s).toFixed(3)}"${o}>${ICONS[n]}</svg>`;
const q=new URLSearchParams(location.search);
const board=q.get('board')||'sheet-capture', theme=q.get('theme')||'dark';
const L=(t,html)=>`<div><p class="cap">${t}</p>${html}</div>`;
const stage=h=>`<div class="stage">${h}</div>`;
const panel=(title,body,o={})=>`<div class="panel"><div class="hdr"><button class="ib back" aria-label="Back">${g('chevron-left',16)}</button><span class="ttl">${title}</span>${o.aside||''}</div><div class="body">${body}</div></div>`;
const ib=(t,o={})=>`<button class="ibtn${o.acc?' acc':''}${o.crit?' crit':''}${o.sm?' sm':''}${o.ghost?' ghost':''}">${o.g?g(o.g,14):''}${t}</button>`;
const cc=(glyph,label,o={})=>`<div class="cc${o.pri?' pri':''}${o.hov?' hov':''}${o.foc?' foc':''}">${g(glyph,20)}<span>${label}</span></div>`;

/* ---------- invented screen content ---------- */
const T={doc:'linear-gradient(180deg,#E8E8E8 0 18%,#F7F7F7 18%)',desk:'linear-gradient(135deg,#2C3E57,#1B2838)',term:'linear-gradient(90deg,#1E1E1E 0 30%,#2B2B2B 30%)',site:'linear-gradient(180deg,#7444F0 0 40%,#F3F3F3 40%)'};
const thumb=(name,meta,bg)=>`<div class="th"><div class="img" style="background:${bg}"></div><div class="n">${name}</div><div class="m">${meta}</div></div>`;
const RECENT=`<div class="thumbs">${thumb('Region · 1280 × 720','2 min ago',T.doc)}${thumb('Window · Terminal','9 min ago',T.term)}${thumb('Screen · 3440 × 1440','Yesterday',T.desk)}${thumb('Freeform · 612 × 488','Yesterday',T.site)}</div>`;

/* ---------- 2. Capture panel ---------- */
const delayC=(t,open)=>`<span class="combo${open?' open':''}">${g('timer',12)}${t} ${g('chevron-down',12)}</span>`;
const MODES=[['square-dashed','Region'],['app-window','Window'],['monitor','Screen'],['screens','All displays'],['lasso','Freeform'],['rotate-ccw-clock','Last region']];
const modes=(o={})=>`<div class="grid6">${MODES.map(([gl,l],i)=>cc(gl,l,{pri:i===0,hov:o.hov===i})).join('')}</div>`;
const W1TOOLS=[['scan-text','Text'],['qr-code','QR code'],['pipette','Color']], W2TOOLS=[['video','Record'],['film','GIF'],['images','Convert']];
const tools=list=>`<div class="grid6" style="margin-top:8px">${list.map(([gl,l])=>cc(gl,l)).join('')}</div>`;
const recentHead=`<div class="sub"><b>Recent</b>${ib('Open folder',{sm:1})}</div>`;
const capPanel=(o={})=>panel('Capture',modes(o)+tools(o.full?[...W1TOOLS,...W2TOOLS]:W1TOOLS)+(o.empty?`<div class="sub"><b>Recent</b></div><div class="card empty" style="height:104px;margin-top:4px">${g('image',24)}No captures yet</div>`:recentHead+RECENT)+(o.extra||''),{aside:delayC(o.delay||'No delay',o.open)});
const delayMenu=`<div class="menu" style="right:0;top:-6px">${['No delay','3 seconds','5 seconds','10 seconds'].map((t,i)=>`<div class="${i===1?'on':''}"><span class="ck">${i===1?g('check',14):''}</span>${t}</div>`).join('')}</div>`;
const tipWin=`<div class="tip" style="left:52px;top:70px">Capture window · Ctrl+Shift+W</div>`;

/* ---------- 3. the frozen screen ---------- */
const win=(x,y,w,h,t,dk)=>`<div class="w${dk?' dk':''}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><div class="tb">${t}</div>${Array.from({length:Math.floor((h-40)/22)},(_,i)=>`<div class="ln${i%4===3?' s':''}"></div>`).join('')}</div>`;
const DESK=win(60,50,560,420,'Quarterly report')+win(520,140,520,400,'Terminal',1)+win(160,380,380,220,'Notes');

  <div class="srow">${L('3. Released: handles stay; tools down the side, Copy and Save under it. Ctrl+C, Ctrl+S, Esc and Enter work without the bars.',ov.released)}</div>
  <div class="srow">${L('4. At a screen edge: the tools flip to the left and the bar goes above',ov.edge)}</div>
  <div class="srow">${L('5. The selection fills the display: the bars sit inside it (Ctrl+A, or Capture full screen)',ov.full)}</div>
  <div class="srow">${L('6. Ctrl+drag: the size pill shows the copy glyph; release copies and closes, with no bars (then "Copied" on the bar)',ov.ctrl)}</div>`,
 'sheet-markup':()=>`<div class="srow">${L('Select: drag a mark to move it, its handles to resize',MK.select)}${L('Pen · P',MK.pen)}${L('Highlighter · H',MK.hl)}</div>
  <div class="srow">${L('Line · L (Shift keeps it straight)',MK.line)}${L('Arrow · A',MK.arrow)}${L('Rectangle · R',MK.rect)}</div>
  <div class="srow">${L('Ellipse · E',MK.ellipse)}${L('Text · T: type in place; size beside it',MK.text)}${L('Redact · D: solid black, flattened on Copy and Save',MK.redact)}</div>
  <div class="srow">${L('Eraser · X: a click removes the whole mark under it',MK.eraser)}${L('Crop · C: drag the corners, then Crop',MK.crop)}${L('The color choice: eight colors, three widths, or pick from the screen',colorPop)}</div>`,
 'sheet-bar':()=>`<div class="srow">${L('Copied',bar(thumbLead(T.doc),'Copied','Region · 1280 × 720'))}${L('Saved',bar(thumbLead(T.desk),'Saved','Screenshots · 1280 × 720'))}${L('Copy failed: the capture stays open',bar(g('triangle-alert'),'Copy failed','Region · 1280 × 720',{cau:1}))}</div>
  <div class="srow">${L('Save failed: the folder is gone',bar(g('triangle-alert'),'Save failed','Folder not found',{cau:1}))}${L('Copy text from screen',bar(g('scan-text'),'Copied text','31 words'))}${L('Nothing read: the clipboard is left alone',bar(g('scan-text'),'No text found','Text and QR',{cau:1}))}</div>
  <div class="srow">${L('Scan QR code, nothing found',bar(g('qr-code'),'No QR code found','Text and QR',{cau:1}))}${L('Pick color',bar('','#7C5CFF','Copied as HEX',{leadStyle:'background:#7C5CFF'}))}${L('Capture after delay',bar(ring(1),'Capturing in 3','Region'))}</div>`,
 'sheet-results':()=>`<div class="srow">${L('Extract text: editable; Ctrl+C copies a selection',stage(resText))}${L('QR code: a link opens only from Open link',stage(resQr))}</div>
  <div class="srow">${L('Several codes: one at a time; text has no Open',stage(resQr2))}${L('Pick and review color: HEX copied; each format copies on its own',stage(resColor))}</div>`,
 'sheet-displays':()=>`<div class="srow">${L('Brightness: All displays moves both',stage(dispMain))}${L('Contrast',stage(dispContrast))}</div>
  <div class="srow">${L('A display that doesn\'t answer; why, and Try again, are in Settings › Displays',stage(dispNa))}</div>`,
 'settings-capture':()=>frame('capture',capturePage()),
 'sheet-settings-capture-states':()=>`<div class="srow">${L('Save folder: the default',`<div class="${theme}" style="width:768px">${card(folderRow())}</div>`)}</div>
  <div class="srow">${L('Change opens Windows\' folder picker; a folder you chose gets Reset',`<div class="${theme}" style="width:768px">${card(folderRow({small:'D:\\Captures',reset:1}))}</div>`)}</div>
  <div class="srow">${L('The folder is gone: Save and Ctrl+S say "Save failed" until it\'s changed',`<div class="${theme}" style="width:768px">${card(folderRow({small:'Folder not found · D:\\Captures',cau:1,reset:1}))}</div>`)}</div>`,
 'settings-text':()=>frame('text',textPage),
 'settings-color':()=>frame('color',colorPage),
 'settings-displays':()=>frame('displays',displaysPage),
 'settings-shortcuts':()=>frame('shortcuts',shortcutsPage)
};
document.body.className=theme;
const html=B[board]();
const wrap=board.startsWith('sheet')||board==='home'?`<div class="sheet ${theme==='light'?'lt':''}"><div class="${theme}" style="display:contents">${html}</div></div>`:`<div style="display:inline-block;padding:24px;background:${theme==='light'?'#D9D9D9':'#161616'}"><div class="${theme}">${html}</div></div>`;
document.getElementById('root').innerHTML=wrap;
const el=document.getElementById('root').firstElementChild;
document.body.dataset.size=Math.ceil(el.getBoundingClientRect().width)+','+Math.ceil(el.getBoundingClientRect().height);
</script>
</body>
</html>
