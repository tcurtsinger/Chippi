# SPDX-License-Identifier: GPL-3.0-or-later
name: RNNoise native
on:
  push:
    paths: ['native/rnnoise/**', '.github/workflows/rnnoise.yml']
  pull_request:
    paths: ['native/rnnoise/**', '.github/workflows/rnnoise.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build with static CRT
        shell: cmd
        run: native\rnnoise\build.cmd ${{ matrix.arch }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rnnoise-${{ matrix.arch }}
          path: |
            build/artifacts/rnnoise/${{ matrix.arch }}/rnnoise.dll
            build/artifacts/rnnoise/${{ matrix.arch }}/rnnoise-smoke.exe
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: rnnoise-${{ matrix.arch }}
          path: native-test
      - name: Load and process on native runner
        shell: pwsh
        run: |
          ./native-test/rnnoise-smoke.exe "$PWD/native-test/rnnoise.dll"
          if ($LASTEXITCODE -ne 0) { throw 'RNNoise smoke failed' }
      - name: Verify committed DLL hashes and test native committed DLL
        shell: pwsh
        run: |
          foreach ($row in (Import-Csv native/rnnoise/hashes.csv)) {
            $file = Get-Item "native/rnnoise/$($row.Path)"
            if ($file.Length -ne [long]$row.Bytes -or
                (Get-FileHash $file.FullName -Algorithm SHA256).Hash -ne $row.SHA256) {
              throw "Committed DLL mismatch: $($row.Path)"
            }
          }
          ./native-test/rnnoise-smoke.exe "$PWD/native/rnnoise/runtimes/win-${{ matrix.arch }}/native/rnnoise.dll"
          if ($LASTEXITCODE -ne 0) { throw 'Committed RNNoise smoke failed' }