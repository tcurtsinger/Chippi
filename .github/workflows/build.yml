# SPDX-License-Identifier: GPL-3.0-or-later
name: Build and test

# A branch is checked by its pull request and main by its push, so each commit runs once.
# Docs, Markdown and the installer manifest don't build or test anything, so changes that
# only touch them skip CI. THIRD-PARTY-NOTICES.md ships with the app, so it still runs.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!phase-1-release-artifacts.csv'
      - 'THIRD-PARTY-NOTICES.md'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!phase-1-release-artifacts.csv'
      - 'THIRD-PARTY-NOTICES.md'
  workflow_dispatch:

# A new push to a pull request cancels its older run. Runs on main all finish.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build application
        run: dotnet build src/Chippi.App/Chippi.App.csproj -c Release -r ${{ matrix.rid }} --no-incremental
      - name: Publish self-contained application
        run: dotnet publish src/Chippi.App/Chippi.App.csproj -p:PublishProfile=${{ matrix.rid }}

  # Runs beside the builds. The solution builds once, in parallel, and each project's tests
  # then run in turn without building again, so a test project must be in Chippi.slnx.
  test:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build solution
        run: dotnet build Chippi.slnx -c Release
      - name: Test on x64
        shell: pwsh
        run: |
          $projects = Get-ChildItem tests -Filter '*.csproj' -Recurse
          if (!$projects) { throw 'No test projects found.' }
          foreach ($project in $projects) {
            dotnet test $project.FullName -c Release --no-build --logger trx --results-directory build/artifacts/test-results
            if ($LASTEXITCODE -ne 0) { throw "Tests failed: $($project.Name)" }
          }
