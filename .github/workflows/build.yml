# SPDX-License-Identifier: GPL-3.0-or-later
name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build application
        run: dotnet build src/Chippi.App/Chippi.App.csproj -c Release -r ${{ matrix.rid }} --no-incremental
      - name: Test on x64
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $projects = Get-ChildItem tests -Filter '*.csproj' -Recurse
          if (!$projects) { throw 'No test projects found.' }
          foreach ($project in $projects) {
            dotnet test $project.FullName -c Release --logger trx --results-directory build/artifacts/test-results
            if ($LASTEXITCODE -ne 0) { throw "Tests failed: $($project.Name)" }
          }
      - name: Publish self-contained application
        run: dotnet publish src/Chippi.App/Chippi.App.csproj -p:PublishProfile=${{ matrix.rid }}
